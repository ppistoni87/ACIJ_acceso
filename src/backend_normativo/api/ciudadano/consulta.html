<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta de derechos · ACIJ Acceso</title>
<style>
/* Paleta de papel y tinta, la misma del resto del producto. Lo que cambia acá
   respecto de la versión anterior es el peso: menos cajas, menos bordes, más
   aire. Una conversación se lee mejor cuando el texto está sobre la página y no
   adentro de un recuadro. */
:root{
  --papel:#F7F6F2; --papel-2:#FFFFFF; --papel-3:#EDEBE4;
  --tinta:#1C2128; --tinta-2:#4B5563; --tinta-3:#5E6572;
  --linea:#E2DFD6; --linea-fuerte:#B9B5A8;
  --sello:#8C3125; --ok:#245840; --espera:#6E4D08; --frio:#28506B;
  --mia:#ECEAE3;
}
@media (prefers-color-scheme: dark){
  :root{
    --papel:#15191F; --papel-2:#1C2129; --papel-3:#242B35;
    --tinta:#EFEEE7; --tinta-2:#B2B9C3; --tinta-3:#8D949E;
    --linea:#2B323C; --linea-fuerte:#48525F;
    --sello:#E89486; --ok:#8AD0AB; --espera:#E6C163; --frio:#98C1DE;
    --mia:#272E38;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; height:100%}
body{
  margin:0; background:var(--papel); color:var(--tinta); min-height:100%;
  /* Pila del sistema, a propósito y sin excepción. Cargar una tipografía de un
     servicio externo le cuenta a ese servicio quién entró a preguntar por sus
     derechos, y ata la pantalla a que ese servicio esté vivo. */
  font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex; flex-direction:column;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--frio); outline-offset:2px}
.vr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.saltar{
  position:absolute; left:-9999px; top:0; background:var(--papel-2); color:var(--tinta);
  padding:10px 16px; border:2px solid var(--tinta); z-index:20;
}
.saltar:focus{left:8px; top:8px}

/* --- barra --- */
header.barra{
  display:flex; align-items:center; gap:10px; padding:10px 18px;
  border-bottom:1px solid var(--linea); background:var(--papel);
  position:sticky; top:0; z-index:10;
}
header.barra h1{
  font-size:.95rem; margin:0; font-weight:600; letter-spacing:-.01em; color:var(--tinta-2);
}
header.barra .acciones{margin-left:auto; display:flex; gap:6px}

.btn{
  padding:9px 16px; border:1px solid transparent; border-radius:8px;
  background:var(--tinta); color:var(--papel-2); font-weight:600;
}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.tenue{
  background:transparent; color:var(--tinta-2); border-color:var(--linea-fuerte);
  font-weight:500; padding:7px 12px; font-size:.87rem; border-radius:7px;
}
.btn.tenue:hover{background:var(--papel-3)}

/* --- el hilo --- */
main{flex:1; width:100%; max-width:720px; margin:0 auto; padding:24px 20px 8px}
@media (max-width:440px){ main{padding:16px 14px 6px} }
/* Mientras no hay conversación, el compositor va al centro: la página se abre
   invitando a escribir, no mostrando una interfaz vacía. */
body.sin-conversacion main{display:flex; flex-direction:column; justify-content:center}
body.sin-conversacion .compositor{position:static; border-top:none; background:transparent}
body.sin-conversacion .compositor .marco{padding-top:4px}

.hilo{display:flex; flex-direction:column; gap:28px}
.msj{max-width:100%}
/* Lo que escribe la persona va en una burbuja discreta, a la derecha. Lo que
   contesta el sistema va sobre la página, sin recuadro: es el cuerpo del
   documento, no una tarjeta. */
.msj.mia{align-self:flex-end; max-width:min(520px,90%)}
.msj.mia .burbuja{
  background:var(--mia); border-radius:16px 16px 4px 16px; padding:11px 15px;
  overflow-wrap:anywhere;
}
.msj .quien{
  font-size:11px; letter-spacing:.06em; text-transform:none;
  color:var(--tinta-3); margin:0 0 6px; font-weight:600;
}
.msj.mia .quien{text-align:right}
.msj.suyo .burbuja{padding:0}
.msj h2{
  margin:0 0 3px; font-size:1.05rem; font-weight:600; letter-spacing:-.01em;
  scroll-margin-top:70px; text-wrap:balance;
}
.msj h3{
  margin:22px 0 8px; font-size:.75rem; letter-spacing:.09em; text-transform:uppercase;
  color:var(--tinta-3); font-weight:700;
}
.msj p{margin:0 0 12px; overflow-wrap:anywhere}
.msj p:last-child{margin-bottom:0}
.msj hr{border:none; border-top:1px solid var(--linea); margin:16px 0}
.norma{font-weight:600}

.sello{
  display:inline-block; font-size:.68rem; letter-spacing:.04em; padding:2px 8px;
  border:1px solid; border-radius:999px; vertical-align:middle; font-weight:600;
}
.s-GENERADA{color:var(--ok); border-color:var(--ok)}
.s-EXTRACTO{color:var(--frio); border-color:var(--frio)}
.s-ABSTENCION{color:var(--espera); border-color:var(--espera)}
.s-ERROR,.s-DEMO{color:var(--sello); border-color:var(--sello)}

.alerta{
  border-left:3px solid var(--espera); background:var(--papel-3); padding:11px 14px;
  margin:0 0 14px; font-size:.94rem; border-radius:0 8px 8px 0;
}
.alerta b{display:block; margin-bottom:3px}
.aviso-privacidad{border-left-color:var(--frio)}
.aviso-demo{border-left-color:var(--sello)}
/* La urgencia no es una advertencia más: va arriba de todo, con el peso de
   algo que hay que leer antes que el resto. */
.urgente{
  border:2px solid var(--sello); border-left-width:5px; border-radius:0 10px 10px 0;
  background:var(--papel-2); padding:14px 16px; margin:0 0 18px;
}
.urgente h3{margin:0 0 6px; font-size:1rem; text-transform:none; letter-spacing:0;
  color:var(--sello); font-weight:700}
.urgente p{margin:0 0 8px; font-size:.96rem}
.urgente p:last-child{margin-bottom:0}

a.nota{
  font-size:.7rem; text-decoration:none; color:var(--frio);
  background:var(--papel-3); border-radius:5px; padding:1px 5px; margin-left:3px;
  white-space:nowrap; font-weight:600;
}
a.nota:hover,a.nota:focus-visible{background:var(--frio); color:var(--papel-2)}

ol.fuentes{margin:0; padding:0 0 0 1.3em; font-size:.93rem}
ol.fuentes li{margin:0 0 10px; overflow-wrap:anywhere}
ol.fuentes .unidad{color:var(--tinta-2); font-size:.89rem}
ol.fuentes a{color:var(--frio)}
ol.fuentes .sin-url{color:var(--tinta-3); font-size:.87rem; font-style:italic}
ol.fuentes li:target{background:var(--papel-3); outline:2px solid var(--frio); outline-offset:4px}

ul.avisos{margin:0; padding:0 0 0 1.15em; color:var(--tinta-2); font-size:.92rem}
ul.avisos li{margin:0 0 6px}
.ayuda{font-size:.87rem; color:var(--tinta-3); margin:4px 0 0}
.titulo-norma{
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; font-size:.82rem; color:var(--tinta-3); line-height:1.45;
}

details.mas{margin:12px 0 0}
details.mas > summary{
  cursor:pointer; font-size:.9rem; color:var(--frio); font-weight:600;
  list-style:none; padding:6px 0;
}
details.mas > summary::-webkit-details-marker{display:none}
details.mas > summary::before{content:"▸ "}
details.mas[open] > summary::before{content:"▾ "}

.ficha{
  margin:16px 0 0; padding:0; font-size:.8rem; color:var(--tinta-3); line-height:1.6;
  border-top:1px solid var(--linea); padding-top:10px;
}
.ficha b{font-weight:600; color:var(--tinta-2)}

.canal{border:1px solid var(--linea); border-radius:10px; padding:12px 14px; margin:0 0 8px}
.canal .nombre{font-weight:600; display:block}
.canal .org,.canal .dir{color:var(--tinta-2); font-size:.9rem; display:block}
.canal ul{margin:6px 0 0; padding:0 0 0 1.15em; font-size:.9rem}

/* --- fichas y sugerencias --- */
.fichas{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 0}
.ficha-btn{
  border:1px solid var(--linea-fuerte); background:var(--papel-2); color:var(--tinta);
  border-radius:10px; padding:9px 14px; font-size:.92rem; text-align:left;
}
.ficha-btn:hover{background:var(--papel-3); border-color:var(--tinta-3)}
.ficha-btn.puesta{border-color:var(--frio); color:var(--frio); font-weight:600}
.ficha-btn .quitar{font-weight:700; margin-left:8px}

.contexto{
  max-width:720px; margin:0 auto; width:100%; padding:8px 20px;
  font-size:.86rem; color:var(--tinta-3);
}
.contexto[hidden]{display:none}
.contexto .fichas{margin:6px 0 0}
.contexto .ficha-btn{padding:5px 11px; font-size:.85rem; border-radius:999px}

/* --- pensando --- */
.pensando{display:flex; gap:5px; align-items:center; padding:4px 0}
.pensando span{
  width:7px; height:7px; border-radius:50%; background:var(--tinta-3);
  animation:latir 1.25s ease-in-out infinite;
}
.pensando span:nth-child(2){animation-delay:.16s}
.pensando span:nth-child(3){animation-delay:.32s}
@keyframes latir{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:.9;transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){
  .pensando span{animation:none; opacity:.5}
}

/* --- el compositor --- */
.compositor{
  position:sticky; bottom:0; background:var(--papel); padding:10px 20px 14px;
  border-top:1px solid var(--linea);
}
.compositor .marco{max-width:720px; margin:0 auto}
.compositor .caja{
  display:flex; gap:8px; align-items:flex-end; background:var(--papel-2);
  border:1px solid var(--linea-fuerte); border-radius:14px; padding:8px 8px 8px 14px;
}
.compositor .caja:focus-within{border-color:var(--tinta-3); box-shadow:0 0 0 3px var(--papel-3)}
textarea#pregunta{
  flex:1; min-height:28px; max-height:180px; resize:none; border:none; background:transparent;
  color:var(--tinta); padding:6px 0; font:inherit; outline:none;
}
.estado{margin:8px 2px 0; font-size:.86rem; color:var(--tinta-2)}
.estado[hidden]{display:none}
.pie{margin:8px 2px 0; font-size:.78rem; color:var(--tinta-3)}

.bienvenida{margin:0 0 4px}
.bienvenida h2{font-size:1.5rem; font-weight:600; letter-spacing:-.02em; margin:0 0 10px;
  text-wrap:balance}
.bienvenida p{color:var(--tinta-2); margin:0 0 10px; max-width:60ch}
</style>
</head>
<body>
<a class="saltar" href="#pregunta">Ir al cuadro para escribir</a>

<header class="barra">
  <h1>ACIJ Acceso · consulta de derechos</h1>
  <div class="acciones">
    <button type="button" class="btn tenue" id="limpiar">Nueva conversación</button>
    <button type="button" class="btn tenue" id="salir">Salir y borrar</button>
  </div>
</header>

<main>
  <div class="hilo" id="resultado" role="log" aria-live="polite" aria-label="Conversación"></div>
</main>

<div class="contexto" id="contexto" hidden>
  <span id="contexto-titulo">Estoy teniendo en cuenta:</span>
  <div class="fichas" id="contexto-fichas"></div>
</div>

<form class="compositor" id="consulta" novalidate>
  <div class="marco">
    <div class="caja">
      <label class="vr" for="pregunta">Escribí tu consulta</label>
      <textarea id="pregunta" name="pregunta" rows="1" autocomplete="off"
                placeholder="Contame qué te está pasando…"
                aria-describedby="pie-compositor"></textarea>
      <button type="submit" class="btn" id="enviar">Enviar</button>
      <button type="button" class="btn tenue" id="cancelar" disabled>Cancelar</button>
    </div>
    <button type="button" class="btn tenue" id="reintentar" hidden>Reintentar</button>
    <p class="estado" id="estado" role="status" aria-live="polite" hidden></p>
    <p class="pie" id="pie-compositor">
      Enter envía · Shift+Enter hace un renglón nuevo. No hace falta tu nombre ni tu documento.
    </p>
  </div>
</form>

<script>
"use strict";

// Todo lo que viene de la API se escapa antes de entrar al DOM. Es texto
// publicado, sí, pero es texto de terceros: se trata como dato, nunca como
// marcado ni como instrucción.
function esc(valor){
  return String(valor == null ? "" : valor)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function $(id){ return document.getElementById(id); }

// Sólo se abren enlaces http(s). Un `javascript:` guardado en la base no se
// convierte en un enlace ejecutable por pasar por acá.
function urlSegura(url){
  if(!url) return null;
  try{
    const u = new URL(url, window.location.origin);
    return (u.protocol === "http:" || u.protocol === "https:") ? u.href : null;
  }catch(_){ return null; }
}

function fechaLegible(iso){
  if(!iso) return "—";
  const d = new Date(iso.length <= 10 ? iso + "T00:00:00" : iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString("es-AR", {day:"2-digit", month:"long", year:"numeric"});
}


// El plan pide que la salida se identifique —explicación, extracto o
// abstención— y también prohíbe «nombres de tablas o detalles del modelo dentro
// del recorrido ciudadano». Las dos cosas se cumplen: la distinción está, dicha
// en castellano. «EXTRACTO» y «ABSTENCION» son palabras nuestras, no de quien
// pregunta si lo pueden desalojar.
const MODOS = {
  GENERADA: ["Esto dicen las normas", "explicado",
    "Te lo explico yo, y cada cosa que digo va atada al texto del que sale."],
  EXTRACTO: ["Esto dice la ley, con sus palabras", "texto de la ley",
    "Te lo copio tal como está escrito. Se lee más pesado, y es exactamente lo que dice — sin nada mío en el medio."],
  ABSTENCION: ["Esto no lo sé", "sin respuesta",
    "Prefiero decirte que no sé antes que inventarte algo."]
};

// --- estado de la conversación ---------------------------------------------
let peticion = null;        // AbortController de la consulta en curso
let ultimoEnvio = null;     // para «Reintentar»
let nMensajes = 0;          // para que las notas al pie no se pisen entre respuestas
let cobertura = [];         // qué normas cubre el corte publicado
// Lo que el sistema está teniendo en cuenta. Vive a la vista y se puede quitar:
// un chat que arrastra supuestos sin mostrarlos es donde estos sistemas empiezan
// a mentir. Acá no hay nada inferido que la persona no pueda ver y borrar.
const contexto = {jurisdiccion:null, jurisdiccionNombre:null, fecha:null};
let jurisdicciones = [];

function mostrarEstado(texto, ocupado){
  const nodo = $("estado");
  if(!texto){ nodo.hidden = true; nodo.textContent = ""; return; }
  nodo.hidden = false;
  nodo.textContent = texto;
  nodo.setAttribute("aria-busy", ocupado ? "true" : "false");
}

function trabajando(si){
  // El botón de enviar no se apaga: se convierte en el de parar, que es lo que
  // una persona busca cuando se arrepintió. Un control deshabilitado mientras
  // el sistema piensa deja a quien escribe sin ninguna salida.
  $("enviar").disabled = si;
  $("cancelar").disabled = !si;
  $("cancelar").hidden = !si;
  $("pregunta").readOnly = si;
}

// --- mensajes ---------------------------------------------------------------
function agregarMensaje(clase, quien, html, foco, desplazar){
  nMensajes += 1;
  const nodo = document.createElement("article");
  nodo.className = "msj " + clase;
  nodo.id = "msj-" + nMensajes;
  nodo.innerHTML = '<p class="quien">' + esc(quien) + '</p><div class="burbuja">' + html + "</div>";
  $("resultado").appendChild(nodo);
  const cabeza = nodo.querySelector("h2");
  if(foco && cabeza){ cabeza.focus(); }
  // El saludo no se desplaza: no hay nada arriba de él, y `scrollIntoView`
  // mueve el punto desde el que el navegador empieza a tabular. Con eso, el
  // primer Tab de la página dejaba de llegar al salto de contenido y caía en la
  // primera sugerencia. Lo encontró la prueba de teclado.
  if(desplazar !== false){ nodo.scrollIntoView({block:"nearest", behavior:"smooth"}); }
  return nodo;
}

let pensando = null;

function mostrarPensando(){
  pensando = document.createElement("article");
  pensando.className = "msj suyo";
  pensando.innerHTML = '<p class="quien">ACIJ Acceso</p><div class="burbuja">' +
    '<div class="pensando" aria-hidden="true"><span></span><span></span><span></span></div>' +
    '<span class="vr">Buscando en las normas</span></div>';
  $("resultado").appendChild(pensando);
  pensando.scrollIntoView({block: "nearest", behavior: "smooth"});
}

function sacarPensando(){
  if(pensando && pensando.parentNode){ pensando.parentNode.removeChild(pensando); }
  pensando = null;
}

function mensajeMio(texto){
  agregarMensaje("mia", "Vos", "<p>" + esc(texto) + "</p>", false);
}

// El texto trae las citas como [[chunk:uuid]]. Se cambian por una nota numerada
// que lleva a la fuente: un uuid no lo verifica nadie.
function conNotas(texto, indicePorChunk, marca){
  const partes = esc(texto).split(/\[\[chunk:([0-9a-fA-F-]{36})\]\]/g);
  let salida = "";
  for(let i = 0; i < partes.length; i++){
    if(i % 2 === 0){
      salida += partes[i]
        .replace(/\*\*([^*]+)\*\*/g, '<span class="norma">$1</span>')
        .replace(/\n{2,}/g, "</p><p>")
        .replace(/^---$/gm, "</p><hr><p>");
    }else{
      const n = indicePorChunk[partes[i].toLowerCase()];
      salida += n ? '<a class="nota" href="#fuente-' + marca + "-" + n + '">fuente ' + n + "</a>" : "";
    }
  }
  return "<p>" + salida + "</p>";
}

// En un hilo de chat, cinco artículos completos son dos mil palabras que
// entierran a quien pregunta. Se muestra el primero —el mejor puntuado— y el
// resto queda a un clic, sin sacarlo: la evidencia no se recorta, se ordena.
// `<details>` y no un acordeón propio porque ya es accesible con teclado y con
// lector de pantalla sin que haya que construirlo.
function textoPlegado(texto, indice, marca){
  const partes = (texto || "").split(/\n\n---\n\n/);
  if(partes.length <= 1) return conNotas(texto, indice, marca);
  const primero = conNotas(partes[0], indice, marca);
  const resto = partes.slice(1).map(function(p){
    return conNotas(p, indice, marca);
  }).join("<hr>");
  const cuantos = partes.length - 1;
  return primero +
    '<details class="mas"><summary>Ver ' + cuantos + " parte" + (cuantos > 1 ? "s" : "") +
    " más de la ley</summary>" + resto + "</details>";
}

function listaDeFuentes(fuentes, marca){
  if(!fuentes.length) return "";
  let html = '<h3>De dónde lo saco</h3><ol class="fuentes">';
  fuentes.forEach(function(f, i){
    const url = urlSegura(f.url_fuente);
    html += '<li id="fuente-' + marca + "-" + (i+1) + '">' +
      '<span class="norma">' + esc(f.norma) + "</span>" +
      (f.unidad ? ' <span class="unidad">' + esc(f.unidad) + "</span><br>" : "") +
      (url
        ? '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' +
          'Ver el texto oficial<span class="vr"> (se abre en una pestaña nueva)</span></a>'
        : '<span class="sin-url">De esta no tengo el enlace oficial. En el organismo te ' +
          "pueden dar el texto.</span>") +
      "</li>";
  });
  return html + "</ol>";
}

function listaDeAvisos(cuerpo){
  const avisos = [];
  if(cuerpo.alternativa) avisos.push(cuerpo.alternativa);
  (cuerpo.avisos || []).forEach(function(a){ avisos.push(a); });
  if(!avisos.length) return "";
  return '<h3>Qué conviene saber</h3><ul class="avisos"><li>' +
    avisos.map(esc).join("</li><li>") + "</li></ul>";
}

// La fecha es lo único de esto que le sirve a una persona: para cuándo vale lo
// que acaba de leer. El identificador del corte no se muestra —es un uuid, no
// le dice nada a nadie— pero queda en el atributo por si alguien de soporte
// necesita reproducir la respuesta.
function fichaDeDatos(cuerpo){
  return '<div class="ficha" data-corte="' + esc(cuerpo.release_id || "") + '">' +
    "Esto vale para el <b>" + esc(fechaLegible(cuerpo.as_of)) + "</b>, con la información " +
    "que tenía cargada ese día. Si la norma cambió después, todavía no lo sé.</div>";
}

function bloqueCobertura(lista){
  if(!lista || !lista.length) return "";
  const items = lista.slice(0, 6).map(function(c){
    return "<li>" + esc(c.norma) + (c.jurisdiccion ? " · " + esc(c.jurisdiccion) : "") +
      (c.titulo ? '<span class="titulo-norma">' + esc(c.titulo) + "</span>" : "") + "</li>";
  }).join("");
  const resto = lista.length > 6 ? "<li>y " + (lista.length - 6) + " norma(s) más</li>" : "";
  return '<h3>Lo que tengo publicado</h3><ul class="avisos">' + items + resto + "</ul>";
}

// Lo que se le dice a alguien que puede estar en una emergencia. Nunca
// diagnostica —«si esto es urgente», no «estás en una emergencia»— y nunca
// inventa un número: los canales son dato curado. Cuando no hay ninguno
// cargado lo dice, porque callarse sería peor.
const URGENCIA = {
  VIOLENCIA: "Si estás en peligro ahora, esto no reemplaza pedir ayuda.",
  SALUD: "Si es una emergencia de salud, esto no reemplaza pedir ayuda.",
  NINEZ: "Si hay chicos o chicas en riesgo ahora, esto no reemplaza pedir ayuda.",
  CALLE: "Si necesitás un lugar esta noche, esto no reemplaza pedir ayuda.",
  ALIMENTOS: "Si hoy no tenés qué comer, esto no reemplaza pedir ayuda."
};

function bloqueUrgencia(urgencia, canales){
  if(!urgencia || !urgencia.clase) return "";
  const linea = URGENCIA[urgencia.clase] || URGENCIA.CALLE;
  let html = '<div class="urgente"><h3>Antes que nada</h3><p>' + esc(linea) + "</p>";
  if(canales && canales.length){
    html += "<p>Podés ir o llamar acá:</p>";
    canales.slice(0, 2).forEach(function(p){
      html += '<p><b>' + esc(p.nombre) + "</b>" +
        (p.direccion ? " · " + esc(p.direccion) : "") +
        ((p.canales || []).filter(function(c){ return c && c.valor; }).slice(0, 2)
          .map(function(c){ return " · " + esc(c.valor); }).join("")) + "</p>";
    });
  }else{
    // Feo, y verdadero. Improvisar un teléfono sería peor: si está mal o no
    // corresponde a esa jurisdicción, el daño es inmediato.
    html += "<p><b>No tengo cargado a quién derivarte, y eso es una falla de este " +
      "sistema, no tuya.</b> Si podés, preguntá en el municipio o en una " +
      "organización del barrio. Abajo te dejo lo que sí tengo publicado.</p>";
  }
  return html + "</div>";
}

function bloqueCanales(canales){
  let html = "<h3>A dónde ir</h3>";
  if(canales && canales.length){
    canales.slice(0, 2).forEach(function(p){
      html += '<div class="canal"><span class="nombre">' + esc(p.nombre) + "</span>" +
        '<span class="org">' + esc(p.organismo || "") + "</span>" +
        (p.direccion ? '<span class="dir">' + esc(p.direccion) +
          (p.localidad ? ", " + esc(p.localidad) : "") + "</span>" : "");
      const cs = (p.canales || []).filter(function(c){ return c && (c.valor || c.tipo); });
      if(cs.length){
        html += "<ul>" + cs.slice(0, 3).map(function(c){
          return "<li>" + esc((c.tipo || "") + ": " + (c.valor || "")) + "</li>";
        }).join("") + "</ul>";
      }
      html += "</div>";
    });
    html += '<p class="ayuda">Quien decide sobre tu caso es el organismo, no esta pantalla.</p>';
  }else{
    html += '<p class="ayuda">No tengo cargado ningún lugar de atención para esa zona. ' +
      "No quiere decir que no exista: quiere decir que yo todavía no lo tengo.</p>";
  }
  return html;
}

function responderEnElHilo(cuerpo, canales){
  const modo = cuerpo.modo || "ERROR";
  const marca = nMensajes + 1;
  const titulo = (MODOS[modo] || ["Respuesta", "", ""])[0];
  const etiqueta = (MODOS[modo] || ["", "", ""])[1];
  const explicacion = (MODOS[modo] || ["", "", ""])[2];

  const indice = {};
  (cuerpo.fuentes || []).forEach(function(f, i){
    indice[String(f.chunk_id).toLowerCase()] = i + 1;
  });

  // Antes del título, antes del modo, antes de todo: si el mensaje parecía una
  // emergencia, eso se lee primero.
  let html = bloqueUrgencia(cuerpo.urgencia, canales);
  html += '<h2 id="titulo-respuesta" tabindex="-1">' + esc(titulo) +
    ' <span class="sello s-' + esc(modo) + '" aria-hidden="true">' + esc(etiqueta) + "</span></h2>" +
    '<p class="ayuda">' + esc(explicacion) + "</p>";

  if(modo === "ABSTENCION"){
    html += "<p>" + esc(cuerpo.texto) + "</p>";
    if(cuerpo.alternativa) html += "<p>" + esc(cuerpo.alternativa) + "</p>";
    html += bloqueCobertura(cuerpo.cobertura);
  }else{
    // La diferencia entre «esto contesta tu pregunta» y «esto se le parece» es
    // justamente lo que quien consulta no puede averiguar solo.
    if(cuerpo.solo_parecidos){
      html += '<div class="alerta"><b>Ojo: esto puede no tener nada que ver con lo tuyo.</b>' +
        "Ninguno de estos textos usa las palabras que escribiste. Los traje porque el tema " +
        "se parece, nada más. Leelos antes de darlos por buenos.</div>";
      html += bloqueCobertura(cuerpo.cobertura);
    }
    html += textoPlegado(cuerpo.texto || "", indice, marca);
    html += listaDeFuentes(cuerpo.fuentes || [], marca);
    html += listaDeAvisos(cuerpo);
  }
  html += bloqueCanales(canales);
  html += fichaDeDatos(cuerpo);

  const nodo = agregarMensaje("suyo", "ACIJ Acceso", html, true);
  nodo.appendChild(sugerenciasDeSeguimiento());
}

function errorEnElHilo(titulo, detalle, reintentable){
  agregarMensaje("suyo", "ACIJ Acceso",
    '<h2 id="titulo-respuesta" tabindex="-1">' + esc(titulo) +
    ' <span class="sello s-ERROR" aria-hidden="true">no anduvo</span></h2><p>' +
    esc(detalle) + "</p>", true);
  $("reintentar").hidden = !reintentable;
}

// --- lo que el sistema tiene en cuenta --------------------------------------
function pintarContexto(){
  const fichas = $("contexto-fichas");
  fichas.innerHTML = "";
  const puestas = [];
  if(contexto.jurisdiccion){
    puestas.push(["jurisdiccion", "Jurisdicción: " + contexto.jurisdiccionNombre]);
  }
  if(contexto.fecha){
    puestas.push(["fecha", "Fecha: " + fechaLegible(contexto.fecha)]);
  }
  $("contexto").hidden = puestas.length === 0;
  puestas.forEach(function(par){
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ficha-btn puesta";
    b.innerHTML = esc(par[1]) + '<span class="quitar" aria-hidden="true">×</span>';
    b.setAttribute("aria-label", "Dejar de tener en cuenta " + par[1]);
    b.addEventListener("click", function(){
      if(par[0] === "jurisdiccion"){ contexto.jurisdiccion = null; contexto.jurisdiccionNombre = null; }
      else { contexto.fecha = null; }
      pintarContexto();
      mostrarEstado("Listo, ya no lo tengo en cuenta.");
    });
    fichas.appendChild(b);
  });
}

function chip(texto, alPulsar){
  const b = document.createElement("button");
  b.type = "button";
  b.className = "ficha-btn";
  b.textContent = texto;
  b.addEventListener("click", alPulsar);
  return b;
}

function sugerenciasDeSeguimiento(){
  const caja = document.createElement("div");
  caja.className = "fichas";
  if(!contexto.jurisdiccion && jurisdicciones.length){
    caja.appendChild(chip("Buscar sólo donde vivo", function(){ pedirJurisdiccion(caja); }));
  }
  if(!contexto.fecha){
    caja.appendChild(chip("Ver qué decía antes", function(){ pedirFecha(caja); }));
  }
  return caja;
}

function pedirJurisdiccion(caja){
  caja.innerHTML = "";
  const titulo = document.createElement("p");
  titulo.className = "ayuda";
  titulo.textContent = "¿Dónde vivís, o dónde vas a hacer el trámite?";
  caja.appendChild(titulo);
  const fichas = document.createElement("div");
  fichas.className = "fichas";
  jurisdicciones.slice(0, 30).forEach(function(j){
    fichas.appendChild(chip(j.nombre, function(){
      contexto.jurisdiccion = j.id;
      contexto.jurisdiccionNombre = j.nombre;
      pintarContexto();
      if(ultimoEnvio) consultar({texto: ultimoEnvio.texto});
    }));
  });
  caja.appendChild(fichas);
  const primera = fichas.querySelector("button");
  if(primera) primera.focus();
}

function pedirFecha(caja){
  caja.innerHTML = "";
  const etiqueta = document.createElement("label");
  etiqueta.className = "ayuda";
  etiqueta.setAttribute("for", "fecha-otra");
  etiqueta.textContent = "¿Para qué día querés saber qué decía la norma?";
  const campo = document.createElement("input");
  campo.type = "date";
  campo.id = "fecha-otra";
  campo.addEventListener("change", function(){
    if(!campo.value) return;
    contexto.fecha = campo.value;
    pintarContexto();
    if(ultimoEnvio) consultar({texto: ultimoEnvio.texto});
  });
  caja.appendChild(etiqueta);
  caja.appendChild(campo);
  campo.focus();
}

// --- apertura ---------------------------------------------------------------
function saludar(){
  // La bienvenida no es un mensaje del hilo: es la portada. Va sobre la página,
  // con el cuadro de escritura debajo, y desaparece en cuanto hay conversación.
  // Un chat que arranca con un mensaje del sistema ya parece usado antes de que
  // nadie lo use.
  const nodo = document.createElement("div");
  nodo.className = "msj suyo bienvenida";
  nodo.innerHTML =
    '<div class="burbuja">' +
    '<h2 tabindex="-1">Hola. Contame qué te está pasando.</h2>' +
    "<p>Escribilo como se lo contarías a alguien. No hace falta que sepas cómo se llama el " +
    "trámite ni qué ley es. Te voy a mostrar qué dicen las normas que tengo publicadas y de " +
    "dónde sale cada cosa, para que puedas llevárselo a quien te atienda.</p>" +
    '<div class="alerta aviso-privacidad"><b>Esto no decide si te corresponde.</b>' +
    "No te lo doy ni te lo niego: eso lo resuelve el organismo. Y no necesito tu nombre, tu " +
    "documento, tu dirección exacta ni datos de otra persona. Nada de lo que escribas se " +
    "guarda, y al salir se borra todo.</div>" +
    bloqueCobertura(cobertura) +
    "</div>";
  $("resultado").appendChild(nodo);
  nodo.appendChild(sugerenciasDeEjemplo());
  document.body.classList.add("sin-conversacion");
}


function sugerenciasDeEjemplo(){
  const caja = document.createElement("div");
  caja.className = "fichas";
  // Las sugerencias salen de lo que el corte realmente cubre, no de una lista
  // escrita a mano: ofrecer ejemplos que el sistema no puede contestar es
  // prometer algo que no tiene.
  // Estas tres están **medidas**: las tres vuelven con textos que además
  // coinciden en palabras con lo publicado. Las anteriores —«¿Quién puede
  // pedirlo?», «¿Qué papeles piden?»— volvían con el aviso de «esto puede no
  // tener nada que ver», o sea que la pantalla sugería una pregunta y después
  // se desdecía de la respuesta. Una sugerencia que el sistema no puede
  // contestar bien es peor que no sugerir nada.
  //
  // Están escritas acá porque hoy lo publicado es una sola ley. Con más normas
  // esto tiene que salir del corpus, y verificarse igual: la regla no es la
  // lista, es que se prueben antes de ofrecerlas.
  const ejemplos = cobertura.length
    ? [
        "Me quedé sin casa después de un incendio",
        "Estoy durmiendo en la calle",
        "¿Tengo que rendir cuentas de lo que gasté?"
      ]
    : ["¿Qué tenés publicado?"];
  ejemplos.forEach(function(texto){
    caja.appendChild(chip(texto, function(){
      $("pregunta").value = texto;
      enviar();
    }));
  });
  return caja;
}

// --- vocabularios y cobertura ----------------------------------------------
async function cargarVocabularios(){
  try{
    const r = await fetch("/v1/vocabularios", {headers:{"Accept":"application/json"}});
    if(!r.ok) throw new Error("HTTP " + r.status);
    const cuerpo = await r.json();
    jurisdicciones = (cuerpo.data || {}).jurisdicciones || [];
    // La versión del contrato no se muestra: no le dice nada a quien pregunta.
  }catch(_){
    jurisdicciones = [];   // se puede preguntar igual, sin acotar
  }
}

async function cargarCobertura(){
  try{
    const r = await fetch("/v1/respuestas", {
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify({consulta:"qué hay publicado", limite:1})
    });
    if(!r.ok) return;
    cobertura = (await r.json()).cobertura || [];
  }catch(_){ cobertura = []; }
}

// --- canal oficial ----------------------------------------------------------
async function buscarCanales(jurisdiccion, senal){
  try{
    const q = jurisdiccion ? "?jurisdiccion=" + encodeURIComponent(jurisdiccion) : "";
    const r = await fetch("/v1/puntos-atencion" + q, {signal: senal});
    if(!r.ok) return [];
    return (await r.json()).data || [];
  }catch(_){ return []; }
}

// --- enviar -----------------------------------------------------------------
async function consultar(envio){
  ultimoEnvio = envio;
  $("reintentar").hidden = true;
  peticion = new AbortController();
  trabajando(true);
  mostrarPensando();

  const cuerpo = {consulta: envio.texto, limite: 5};
  if(contexto.jurisdiccion) cuerpo.jurisdiccion = contexto.jurisdiccion;
  const ruta = "/v1/respuestas" +
    (contexto.fecha ? "?as_of=" + encodeURIComponent(contexto.fecha) : "");

  try{
    const r = await fetch(ruta, {
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify(cuerpo),
      signal: peticion.signal
    });
    if(r.status === 422){
      errorEnElHilo("No te entendí",
        "Probá escribirlo de otra manera, un poco más corto.", true);
      mostrarEstado("");
      return;
    }
    if(!r.ok){
      errorEnElHilo("No pude contestarte ahora",
        "Ojo: no es que la respuesta sea que no te corresponde. Es que no pude fijarme. " +
        "Probá de nuevo en un momento.", true);
      mostrarEstado("");
      return;
    }
    const datos = await r.json();
    if(datos.cobertura && datos.cobertura.length) cobertura = datos.cobertura;
    const canales = await buscarCanales(contexto.jurisdiccion, peticion.signal);
    sacarPensando();
    mostrarEstado("");
    responderEnElHilo(datos, canales);
  }catch(error){
    if(error && error.name === "AbortError"){
      sacarPensando();
      mostrarEstado("Listo, lo cancelé.");
      return;
    }
    errorEnElHilo("No llegué a conectarme",
      "Puede ser la conexión. Lo que escribiste sigue acá; probá de nuevo.", true);
    mostrarEstado("");
  }finally{
    sacarPensando();
    peticion = null;
    trabajando(false);
  }
}

function enviar(){
  const texto = $("pregunta").value.trim();
  if(!texto){
    mostrarEstado("Escribime qué querés saber y lo busco.");
    $("pregunta").focus();
    return;
  }
  const portada = document.querySelector(".bienvenida");
  if(portada){ portada.remove(); }
  document.body.classList.remove("sin-conversacion");
  mensajeMio(texto);
  $("pregunta").value = "";
  ajustarAlto();
  consultar({texto: texto});
}

function ajustarAlto(){
  const caja = $("pregunta");
  caja.style.height = "auto";
  caja.style.height = Math.min(180, caja.scrollHeight) + "px";
}

// --- borrado ----------------------------------------------------------------
// El frente ciudadano no guarda credenciales, pero sí tiene a la vista lo que la
// persona contó de su situación, y en un chat eso es más que en un formulario.
// Salir lo borra de verdad: el hilo entero, lo que quedó escrito sin enviar y
// cualquier cosa que haya quedado en el almacenamiento del navegador. Una
// pantalla compartida es el caso normal, no el raro.
function borrarTodo(mensaje, saludarDeNuevo){
  if(peticion) peticion.abort();
  $("resultado").innerHTML = "";
  $("pregunta").value = "";
  ajustarAlto();
  $("reintentar").hidden = true;
  ultimoEnvio = null;
  nMensajes = 0;
  contexto.jurisdiccion = null;
  contexto.jurisdiccionNombre = null;
  contexto.fecha = null;
  pintarContexto();
  try{ sessionStorage.clear(); localStorage.clear(); }catch(_){}
  mostrarEstado(mensaje || "");
  document.body.classList.add("sin-conversacion");
  if(saludarDeNuevo) saludar();
  $("pregunta").focus();
}

// --- arranque ---------------------------------------------------------------
document.addEventListener("DOMContentLoaded", async function(){
  await cargarVocabularios();
  await cargarCobertura();
  saludar();
  pintarContexto();

  $("consulta").addEventListener("submit", function(evento){
    evento.preventDefault();
    enviar();
  });

  $("pregunta").addEventListener("input", ajustarAlto);
  $("pregunta").addEventListener("keydown", function(evento){
    if(evento.key === "Enter" && !evento.shiftKey){
      evento.preventDefault();
      enviar();
    }
  });

  $("cancelar").hidden = true;
  $("cancelar").addEventListener("click", function(){ if(peticion) peticion.abort(); });
  $("reintentar").addEventListener("click", function(){
    if(ultimoEnvio) consultar(ultimoEnvio);
  });
  $("limpiar").addEventListener("click", function(){
    borrarTodo("", true);
  });
  $("salir").addEventListener("click", function(){
    borrarTodo("Listo. Borré la conversación y todo lo que habías escrito.", false);
  });
});
</script>
