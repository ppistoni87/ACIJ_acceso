<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta de derechos · ACIJ Acceso</title>
<style>
/* Paleta de papel y tinta, la misma del resto del producto. Lo que cambia acá
   respecto de la versión anterior es el peso: menos cajas, menos bordes, más
   aire. Una conversación se lee mejor cuando el texto está sobre la página y no
   adentro de un recuadro. */
:root{
  --papel:#F7F6F2; --papel-2:#FFFFFF; --papel-3:#EDEBE4;
  --tinta:#1C2128; --tinta-2:#4B5563; --tinta-3:#5E6572;
  --linea:#E2DFD6; --linea-fuerte:#B9B5A8;
  --sello:#8C3125; --ok:#245840; --espera:#6E4D08; --frio:#28506B;
  --mia:#ECEAE3;
}
@media (prefers-color-scheme: dark){
  :root{
    --papel:#15191F; --papel-2:#1C2129; --papel-3:#242B35;
    --tinta:#EFEEE7; --tinta-2:#B2B9C3; --tinta-3:#8D949E;
    --linea:#2B323C; --linea-fuerte:#48525F;
    --sello:#E89486; --ok:#8AD0AB; --espera:#E6C163; --frio:#98C1DE;
    --mia:#272E38;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; height:100%}
body{
  margin:0; background:var(--papel); color:var(--tinta); min-height:100%;
  /* Pila del sistema, a propósito y sin excepción. Cargar una tipografía de un
     servicio externo le cuenta a ese servicio quién entró a preguntar por sus
     derechos, y ata la pantalla a que ese servicio esté vivo. */
  font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex; flex-direction:column;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--frio); outline-offset:2px}
.vr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.saltar{
  position:absolute; left:-9999px; top:0; background:var(--papel-2); color:var(--tinta);
  padding:10px 16px; border:2px solid var(--tinta); z-index:20;
}
.saltar:focus{left:8px; top:8px}

/* --- barra --- */
header.barra{
  /* Envuelve. Con tres acciones y un teléfono de 360 px no entran en una fila,
     y una barra que no envuelve empuja la página entera hacia el costado. */
  display:flex; align-items:center; flex-wrap:wrap; gap:10px; padding:10px 18px;
  border-bottom:1px solid var(--linea); background:var(--papel);
  position:sticky; top:0; z-index:10;
}
header.barra h1{
  font-size:.95rem; margin:0; font-weight:600; letter-spacing:-.01em; color:var(--tinta-2);
}
header.barra .acciones{margin-left:auto; display:flex; flex-wrap:wrap; gap:6px}

.btn{
  padding:9px 16px; border:1px solid transparent; border-radius:8px;
  background:var(--tinta); color:var(--papel-2); font-weight:600;
}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.tenue{
  background:transparent; color:var(--tinta-2); border-color:var(--linea-fuerte);
  font-weight:500; padding:7px 12px; font-size:.87rem; border-radius:7px;
}
.btn.tenue:hover{background:var(--papel-3)}

/* --- el hilo --- */
main{flex:1; width:100%; max-width:720px; margin:0 auto; padding:24px 20px 8px}
@media (max-width:440px){ main{padding:16px 14px 6px} }
/* Mientras no hay conversación, el compositor va al centro: la página se abre
   invitando a escribir, no mostrando una interfaz vacía. */
body.sin-conversacion main{display:flex; flex-direction:column; justify-content:center}
body.sin-conversacion .compositor{position:static; border-top:none; background:transparent}
body.sin-conversacion .compositor .marco{padding-top:4px}

.hilo{display:flex; flex-direction:column; gap:28px}
.msj{max-width:100%}
/* Lo que escribe la persona va en una burbuja discreta, a la derecha. Lo que
   contesta el sistema va sobre la página, sin recuadro: es el cuerpo del
   documento, no una tarjeta. */
.msj.mia{align-self:flex-end; max-width:min(520px,90%)}
.msj.mia .burbuja{
  background:var(--mia); border-radius:16px 16px 4px 16px; padding:11px 15px;
  overflow-wrap:anywhere;
}
.msj .quien{
  font-size:11px; letter-spacing:.06em; text-transform:none;
  color:var(--tinta-3); margin:0 0 6px; font-weight:600;
}
.msj.mia .quien{text-align:right}
.msj.suyo .burbuja{padding:0}
.msj h2{
  margin:0 0 3px; font-size:1.05rem; font-weight:600; letter-spacing:-.01em;
  scroll-margin-top:70px; text-wrap:balance;
}
.msj h3{
  margin:22px 0 8px; font-size:.75rem; letter-spacing:.09em; text-transform:uppercase;
  color:var(--tinta-3); font-weight:700;
}
.msj p{margin:0 0 12px; overflow-wrap:anywhere}
.msj p:last-child{margin-bottom:0}
.msj hr{border:none; border-top:1px solid var(--linea); margin:16px 0}
.norma{font-weight:600}

.sello{
  display:inline-block; font-size:.68rem; letter-spacing:.04em; padding:2px 8px;
  border:1px solid; border-radius:999px; vertical-align:middle; font-weight:600;
}
.s-GENERADA{color:var(--ok); border-color:var(--ok)}
.s-EXTRACTO{color:var(--frio); border-color:var(--frio)}
.s-ABSTENCION{color:var(--espera); border-color:var(--espera)}
.s-ERROR,.s-DEMO{color:var(--sello); border-color:var(--sello)}

.alerta{
  border-left:3px solid var(--espera); background:var(--papel-3); padding:11px 14px;
  margin:0 0 14px; font-size:.94rem; border-radius:0 8px 8px 0;
}
.alerta b{display:block; margin-bottom:3px}
.aviso-privacidad{border-left-color:var(--frio)}
.aviso-demo{border-left-color:var(--sello)}
/* La urgencia no es una advertencia más: va arriba de todo, con el peso de
   algo que hay que leer antes que el resto. */
.urgente{
  border:2px solid var(--sello); border-left-width:5px; border-radius:0 10px 10px 0;
  background:var(--papel-2); padding:14px 16px; margin:0 0 18px;
}
.urgente h3{margin:0 0 6px; font-size:1rem; text-transform:none; letter-spacing:0;
  color:var(--sello); font-weight:700}
.urgente p{margin:0 0 8px; font-size:.96rem}
.urgente p:last-child{margin-bottom:0}

a.nota{
  font-size:.7rem; text-decoration:none; color:var(--frio);
  background:var(--papel-3); border-radius:5px; padding:1px 5px; margin-left:3px;
  white-space:nowrap; font-weight:600;
}
a.nota:hover,a.nota:focus-visible{background:var(--frio); color:var(--papel-2)}

ol.fuentes{margin:0; padding:0 0 0 1.3em; font-size:.93rem}
ol.fuentes li{margin:0 0 10px; overflow-wrap:anywhere}
ol.fuentes .unidad{color:var(--tinta-2); font-size:.89rem}
ol.fuentes a{color:var(--frio)}
ol.fuentes .sin-url{color:var(--tinta-3); font-size:.87rem; font-style:italic}
ol.fuentes li:target{background:var(--papel-3); outline:2px solid var(--frio); outline-offset:4px}

ul.avisos{margin:0; padding:0 0 0 1.15em; color:var(--tinta-2); font-size:.92rem}
ul.avisos li{margin:0 0 6px}
.ayuda{font-size:.87rem; color:var(--tinta-3); margin:4px 0 0}
.titulo-norma{
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; font-size:.82rem; color:var(--tinta-3); line-height:1.45;
}

details.mas{margin:12px 0 0}
details.mas > summary{
  cursor:pointer; font-size:.9rem; color:var(--frio); font-weight:600;
  list-style:none; padding:6px 0;
}
details.mas > summary::-webkit-details-marker{display:none}
details.mas > summary::before{content:"▸ "}
details.mas[open] > summary::before{content:"▾ "}

.ficha{
  margin:16px 0 0; padding:0; font-size:.8rem; color:var(--tinta-3); line-height:1.6;
  border-top:1px solid var(--linea); padding-top:10px;
}
.ficha b{font-weight:600; color:var(--tinta-2)}

.canal{border:1px solid var(--linea); border-radius:10px; padding:12px 14px; margin:0 0 8px}
.canal .nombre{font-weight:600; display:block}
.canal .org,.canal .dir{color:var(--tinta-2); font-size:.9rem; display:block}
.canal ul{margin:6px 0 0; padding:0 0 0 1.15em; font-size:.9rem}

/* --- fichas y sugerencias --- */
/* El cierre de la respuesta. Va discreto y al pie: preguntar «¿te sirvió?» con
   el mismo peso visual que la respuesta convierte la pantalla en una encuesta.
   No hay caja de texto y no la va a haber: es donde alguien escribiría su caso
   completo, y nada de eso se guarda. */
.cierre{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px;
  margin:18px 0 0; padding-top:12px; border-top:1px solid var(--linea);
}
.cierre .rotulo{font-size:.87rem; color:var(--tinta-3)}
.cierre .ficha-btn{padding:6px 12px; font-size:.87rem; border-radius:999px}
.cierre .persona{margin-left:auto}
.cierre-gracias{
  margin:18px 0 0; padding-top:12px; border-top:1px solid var(--linea);
  font-size:.9rem; color:var(--tinta-2);
}
.cierre-gracias p{margin:0 0 6px}
.cierre-gracias p:last-child{margin-bottom:0}
@media (max-width:520px){ .cierre .persona{margin-left:0} }

.fichas{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 0}
.ficha-btn{
  border:1px solid var(--linea-fuerte); background:var(--papel-2); color:var(--tinta);
  border-radius:10px; padding:9px 14px; font-size:.92rem; text-align:left;
}
.ficha-btn:hover{background:var(--papel-3); border-color:var(--tinta-3)}
.ficha-btn.puesta{border-color:var(--frio); color:var(--frio); font-weight:600}
.ficha-btn .quitar{font-weight:700; margin-left:8px}

.contexto{
  max-width:720px; margin:0 auto; width:100%; padding:8px 20px;
  font-size:.86rem; color:var(--tinta-3);
}
.contexto[hidden]{display:none}
.contexto .fichas{margin:6px 0 0}
.contexto .ficha-btn{padding:5px 11px; font-size:.85rem; border-radius:999px}

/* --- pensando --- */
.pensando{display:flex; gap:5px; align-items:center; padding:4px 0}
.pensando span{
  width:7px; height:7px; border-radius:50%; background:var(--tinta-3);
  animation:latir 1.25s ease-in-out infinite;
}
.pensando span:nth-child(2){animation-delay:.16s}
.pensando span:nth-child(3){animation-delay:.32s}
@keyframes latir{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:.9;transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){
  .pensando span{animation:none; opacity:.5}
}

/* --- el compositor --- */
.compositor{
  position:sticky; bottom:0; background:var(--papel); padding:10px 20px 14px;
  border-top:1px solid var(--linea);
}
.compositor .marco{max-width:720px; margin:0 auto}
.compositor .caja{
  display:flex; gap:8px; align-items:flex-end; background:var(--papel-2);
  border:1px solid var(--linea-fuerte); border-radius:14px; padding:8px 8px 8px 14px;
}
.compositor .caja:focus-within{border-color:var(--tinta-3); box-shadow:0 0 0 3px var(--papel-3)}
textarea#pregunta{
  flex:1; min-height:28px; max-height:180px; resize:none; border:none; background:transparent;
  color:var(--tinta); padding:6px 0; font:inherit; outline:none;
}
.estado{margin:8px 2px 0; font-size:.86rem; color:var(--tinta-2)}
.estado[hidden]{display:none}
.pie{margin:8px 2px 0; font-size:.78rem; color:var(--tinta-3)}

/* --- orientación: lo que las reglas dicen con lo que la persona contó ------ */
.orienta{
  border:1px solid var(--linea); border-radius:12px; padding:14px 16px; margin:16px 0 0;
  background:var(--papel-2);
}
.orienta h3{margin:0 0 4px}
.orienta .programa{font-weight:600; color:var(--tinta); display:block; margin:0 0 8px}
.orienta ul{margin:4px 0 12px; padding:0 0 0 1.1em; font-size:.93rem; color:var(--tinta-2)}
.orienta li{margin:0 0 5px}
.orienta .grupo{margin:0 0 10px}
.orienta .grupo:last-child{margin-bottom:0}
.orienta .rotulo{
  font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; color:var(--tinta-3);
  font-weight:600; display:block; margin:0 0 3px;
}
.orienta .r-cumple{color:var(--ok)}
.orienta .r-no{color:var(--sello)}
.orienta .r-falta{color:var(--espera)}

/* Próximos pasos: lo único accionable de toda la respuesta. */
.pasos{margin:0 0 10px}
.pasos ol{margin:6px 0 0; padding:0 0 0 1.3em; font-size:.94rem}
.pasos li{margin:0 0 8px}
.pasos .respaldo{
  display:block; font-size:.87rem; color:var(--tinta-3);
  border-left:2px solid var(--linea); padding-left:10px; margin:4px 0 0;
}
.pasos .no-inicia{
  margin:10px 0 0; font-size:.87rem; color:var(--tinta-2);
  border-left:3px solid var(--frio); padding-left:10px;
}
.canal .verificado{display:block; font-size:.82rem; color:var(--tinta-3); margin-top:4px}

/* Las opciones de una necesidad: qué hay publicado para esa situación. */
.opcion{
  border:1px solid var(--linea); border-radius:10px; padding:12px 14px; margin:0 0 8px;
  background:var(--papel-2);
}
.opcion .nombre{font-weight:600; display:block; margin:0 0 4px}
.opcion .porque{font-size:.87rem; color:var(--tinta-3); margin:6px 0 0}
.opcion .lejos{color:var(--espera)}
.opcion p{margin:0; font-size:.93rem; color:var(--tinta-2)}
.opcion .fichas{margin:10px 0 0}

/* Las salidas que la norma prevé para lo que bloquea. Se ven distinto de una
   condición más: son lo único accionable de un resultado desfavorable. */
.salida{
  border:1px solid var(--espera); border-left-width:4px; border-radius:10px;
  padding:12px 14px; margin:0 0 10px; background:var(--papel-2);
}
.salida .bloqueo{margin:0 0 8px; font-size:.93rem; color:var(--tinta-2)}
.salida .bloqueo b{color:var(--tinta)}
.salida ul{margin:6px 0 0; padding:0 0 0 1.1em; font-size:.93rem}
.salida .alcanza{color:var(--ok); font-weight:600}
.salida .falta{color:var(--espera); font-weight:600}
.salida .no-alcanza{color:var(--tinta-3)}
.salida .sin-salida{margin:0; font-size:.93rem; color:var(--tinta-2)}

/* La pregunta: una por vez, con el texto de la norma arriba y el control abajo. */
.pregunta{
  border:1px solid var(--linea-fuerte); border-radius:12px; padding:14px 16px; margin:16px 0 0;
  background:var(--papel-2);
}
.pregunta .dice{
  margin:0 0 10px; padding-left:12px; border-left:3px solid var(--linea-fuerte);
  color:var(--tinta-2); font-size:.94rem;
}
.pregunta .enunciado{font-weight:600; margin:0 0 10px}
.pregunta input[type=number],.pregunta input[type=date]{
  font:inherit; padding:8px 10px; border:1px solid var(--linea-fuerte); border-radius:8px;
  background:var(--papel); color:var(--tinta); max-width:220px;
}
.pregunta .unidad{color:var(--tinta-3); font-size:.9rem; margin-left:8px}

/* Lo que la persona confirmó. Vive a la vista y se puede corregir o sacar. */
.repaso{
  max-width:720px; margin:0 auto; width:100%;
  border:1px solid var(--linea); border-radius:12px; padding:12px 14px;
  background:var(--papel-3);
  /* Con muchos datos confirmados el panel no puede empujar el cuadro de
     escribir fuera de la pantalla: se desplaza él. */
  max-height:34vh; overflow-y:auto;
}
.repaso[hidden]{display:none}
.repaso h3{margin:0 0 6px}
.repaso ol{margin:0; padding:0; list-style:none}
.repaso li{
  display:flex; flex-wrap:wrap; gap:8px; align-items:baseline;
  padding:8px 0; border-top:1px solid var(--linea);
}
.repaso li:first-child{border-top:none}
.repaso .dicho{flex:1 1 240px; font-size:.92rem}
.repaso .valor{font-weight:600}
.repaso .origen{font-size:.8rem; color:var(--tinta-3); display:block}
.repaso .ficha-btn{padding:4px 10px; font-size:.83rem; border-radius:999px}

/* Una respuesta que se calculó con un dato que después se corrigió. No se
   borra: se marca. Borrarla dejaría a la persona sin saber que cambió. */
.msj.reemplazada .burbuja{opacity:.55}
.reemplazo{
  border-left:3px solid var(--espera); padding:6px 0 6px 12px; margin:0 0 10px;
  font-size:.89rem; color:var(--tinta-2);
}

.bienvenida{margin:0 0 4px}
.bienvenida h2{font-size:1.5rem; font-weight:600; letter-spacing:-.02em; margin:0 0 10px;
  text-wrap:balance}
.bienvenida p{color:var(--tinta-2); margin:0 0 10px; max-width:60ch}
</style>
</head>
<body>
<a class="saltar" href="#pregunta">Ir al cuadro para escribir</a>

<header class="barra">
  <h1>ACIJ Acceso · consulta de derechos</h1>
  <div class="acciones">
    <button type="button" class="btn tenue" id="bajar-resumen" hidden>Descargar lo que leí</button>
    <button type="button" class="btn tenue" id="limpiar">Nueva conversación</button>
    <button type="button" class="btn tenue" id="salir">Salir y borrar</button>
  </div>
</header>

<main>
  <div class="hilo" id="resultado" role="log" aria-live="polite" aria-label="Conversación"></div>
</main>

<div class="contexto" id="contexto" hidden>
  <span id="contexto-titulo">Estoy teniendo en cuenta:</span>
  <div class="fichas" id="contexto-fichas"></div>
</div>

<!-- Lo que la persona confirmó, siempre a la vista y siempre corregible. No es
     un mensaje del hilo: es el estado actual, y un estado que hay que buscar
     scrolleando hacia arriba es un estado que la persona no controla. -->
<section class="repaso" id="repaso" aria-labelledby="repaso-titulo" hidden>
  <h3 id="repaso-titulo">Revisar lo que me contaste</h3>
  <ol id="repaso-lista"></ol>
  <div class="fichas">
    <button type="button" class="ficha-btn" id="borrar-conversacion">Borrar estos datos</button>
  </div>
</section>

<form class="compositor" id="consulta" novalidate>
  <div class="marco">
    <div class="caja">
      <label class="vr" for="pregunta">Escribí tu consulta</label>
      <textarea id="pregunta" name="pregunta" rows="1" autocomplete="off"
                placeholder="Contame qué te está pasando…"
                aria-describedby="pie-compositor"></textarea>
      <button type="submit" class="btn" id="enviar">Enviar</button>
      <button type="button" class="btn tenue" id="cancelar" disabled>Cancelar</button>
    </div>
    <button type="button" class="btn tenue" id="reintentar" hidden>Reintentar</button>
    <p class="estado" id="estado" role="status" aria-live="polite" hidden></p>
    <p class="pie" id="pie-compositor">
      Enter envía · Shift+Enter hace un renglón nuevo. No hace falta tu nombre ni tu documento.
      Tus mensajes no se guardan; lo que confirmes, sí, y lo podés borrar.
    </p>
  </div>
</form>

<script>
"use strict";

// Todo lo que viene de la API se escapa antes de entrar al DOM. Es texto
// publicado, sí, pero es texto de terceros: se trata como dato, nunca como
// marcado ni como instrucción.
function esc(valor){
  return String(valor == null ? "" : valor)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function $(id){ return document.getElementById(id); }

// Sólo se abren enlaces http(s). Un `javascript:` guardado en la base no se
// convierte en un enlace ejecutable por pasar por acá.
function urlSegura(url){
  if(!url) return null;
  try{
    const u = new URL(url, window.location.origin);
    return (u.protocol === "http:" || u.protocol === "https:") ? u.href : null;
  }catch(_){ return null; }
}

function fechaLegible(iso){
  if(!iso) return "—";
  const d = new Date(iso.length <= 10 ? iso + "T00:00:00" : iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString("es-AR", {day:"2-digit", month:"long", year:"numeric"});
}


// El plan pide que la salida se identifique —explicación, extracto o
// abstención— y también prohíbe «nombres de tablas o detalles del modelo dentro
// del recorrido ciudadano». Las dos cosas se cumplen: la distinción está, dicha
// en castellano. «EXTRACTO» y «ABSTENCION» son palabras nuestras, no de quien
// pregunta si lo pueden desalojar.
const MODOS = {
  GENERADA: ["Esto dicen las normas", "explicado",
    "Te lo explico yo, y cada cosa que digo va atada al texto del que sale."],
  EXTRACTO: ["Esto dice la ley, con sus palabras", "texto de la ley",
    "Te lo copio tal como está escrito. Se lee más pesado, y es exactamente lo que dice — sin nada mío en el medio."],
  ABSTENCION: ["Esto no lo sé", "sin respuesta",
    "Prefiero decirte que no sé antes que inventarte algo."]
};

// --- estado de la conversación ---------------------------------------------
let peticion = null;        // AbortController de la consulta en curso
let ultimoEnvio = null;     // para «Reintentar»
let nMensajes = 0;          // para que las notas al pie no se pisen entre respuestas
let cobertura = [];         // qué normas cubre el corte publicado
// Lo que el sistema está teniendo en cuenta. Vive a la vista y se puede quitar:
// un chat que arrastra supuestos sin mostrarlos es donde estos sistemas empiezan
// a mentir. Acá no hay nada inferido que la persona no pueda ver y borrar.
const contexto = {jurisdiccion:null, jurisdiccionNombre:null, fecha:null,
                  programa:null, programaNombre:null};
let jurisdicciones = [];

function mostrarEstado(texto, ocupado){
  const nodo = $("estado");
  if(!texto){ nodo.hidden = true; nodo.textContent = ""; return; }
  nodo.hidden = false;
  nodo.textContent = texto;
  nodo.setAttribute("aria-busy", ocupado ? "true" : "false");
}

function trabajando(si){
  // El botón de enviar no se apaga: se convierte en el de parar, que es lo que
  // una persona busca cuando se arrepintió. Un control deshabilitado mientras
  // el sistema piensa deja a quien escribe sin ninguna salida.
  $("enviar").disabled = si;
  $("cancelar").disabled = !si;
  $("cancelar").hidden = !si;
  $("pregunta").readOnly = si;
}

// --- mensajes ---------------------------------------------------------------
function hayQueOfrecerElResumen(){
  // Sólo cuando hay conversación: un botón para descargar una pantalla vacía es
  // una promesa de que algo pasó.
  $("bajar-resumen").hidden = $("resultado").querySelectorAll(".msj:not(.bienvenida)").length === 0;
}

function agregarMensaje(clase, quien, html, foco, desplazar){
  nMensajes += 1;
  const nodo = document.createElement("article");
  nodo.className = "msj " + clase;
  nodo.id = "msj-" + nMensajes;
  nodo.innerHTML = '<p class="quien">' + esc(quien) + '</p><div class="burbuja">' + html + "</div>";
  $("resultado").appendChild(nodo);
  hayQueOfrecerElResumen();
  const cabeza = nodo.querySelector("h2");
  if(foco && cabeza){ cabeza.focus(); }
  // El saludo no se desplaza: no hay nada arriba de él, y `scrollIntoView`
  // mueve el punto desde el que el navegador empieza a tabular. Con eso, el
  // primer Tab de la página dejaba de llegar al salto de contenido y caía en la
  // primera sugerencia. Lo encontró la prueba de teclado.
  if(desplazar !== false){ nodo.scrollIntoView({block:"nearest", behavior:"smooth"}); }
  return nodo;
}

let pensando = null;

function mostrarPensando(){
  pensando = document.createElement("article");
  pensando.className = "msj suyo";
  pensando.innerHTML = '<p class="quien">ACIJ Acceso</p><div class="burbuja">' +
    '<div class="pensando" aria-hidden="true"><span></span><span></span><span></span></div>' +

function sacarPensando(){

  pensando = null;
}

function mensajeMio(texto){
  agregarMensaje("mia", "Vos", "<p>" + esc(texto) + "</p>", false);
}

// El texto trae las citas como [[chunk:uuid]]. Se cambian por una nota numerada
// que lleva a la fuente: un uuid no lo verifica nadie.
function conNotas(texto, indicePorChunk, marca){
  const partes = esc(texto).split(/\[\[chunk:([0-9a-fA-F-]{36})\]\]/g);
  let salida = "";
  for(let i = 0; i < partes.length; i++){
    if(i % 2 === 0){
      salida += partes[i]
        .replace(/\*\*([^*]+)\*\*/g, '<span class="norma">$1</span>')
        .replace(/\n{2,}/g, "</p><p>")
        .replace(/^---$/gm, "</p><hr><p>");
    }else{
      const n = indicePorChunk[partes[i].toLowerCase()];
      salida += n ? '<a class="nota" href="#fuente-' + marca + "-" + n + '">fuente ' + n + "</a>" : "";
    }
  }
  return "<p>" + salida + "</p>";
}

// En un hilo de chat, cinco artículos completos son dos mil palabras que
// entierran a quien pregunta. Se muestra el primero —el mejor puntuado— y el
// resto queda a un clic, sin sacarlo: la evidencia no se recorta, se ordena.
// `<details>` y no un acordeón propio porque ya es accesible con teclado y con
// lector de pantalla sin que haya que construirlo.
function textoPlegado(texto, indice, marca){
  const partes = (texto || "").split(/\n\n---\n\n/);
  if(partes.length <= 1) return conNotas(texto, indice, marca);
  const primero = conNotas(partes[0], indice, marca);
  const resto = partes.slice(1).map(function(p){
    return conNotas(p, indice, marca);
  }).join("<hr>");
  const cuantos = partes.length - 1;
  return primero +
    '<details class="mas"><summary>Ver ' + cuantos + " parte" + (cuantos > 1 ? "s" : "") +
    " más de la ley</summary>" + resto + "</details>";
}

function listaDeFuentes(fuentes, marca){
  if(!fuentes.length) return "";
  let html = '<h3>De dónde lo saco</h3><ol class="fuentes">';
  fuentes.forEach(function(f, i){
    const url = urlSegura(f.url_fuente);
    html += '<li id="fuente-' + marca + "-" + (i+1) + '">' +
      '<span class="norma">' + esc(f.norma) + "</span>" +
      (f.unidad ? ' <span class="unidad">' + esc(f.unidad) + "</span><br>" : "") +
      (url
        ? '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' +
          'Ver el texto oficial<span class="vr"> (se abre en una pestaña nueva)</span></a>'
        : '<span class="sin-url">De esta no tengo el enlace oficial. En el organismo te ' +
          "pueden dar el texto.</span>") +
      "</li>";
  });
  return html + "</ol>";
}

function listaDeAvisos(cuerpo){
  const avisos = [];
  if(cuerpo.alternativa) avisos.push(cuerpo.alternativa);
  (cuerpo.avisos || []).forEach(function(a){ avisos.push(a); });
  if(!avisos.length) return "";
  return '<h3>Qué conviene saber</h3><ul class="avisos"><li>' +
    avisos.map(esc).join("</li><li>") + "</li></ul>";
}

// La fecha es lo único de esto que le sirve a una persona: para cuándo vale lo
// que acaba de leer. El identificador del corte no se muestra —es un uuid, no
// le dice nada a nadie— pero queda en el atributo por si alguien de soporte
// necesita reproducir la respuesta.
function fichaDeDatos(cuerpo){
  return '<div class="ficha" data-corte="' + esc(cuerpo.release_id || "") + '">' +
    "Esto vale para el <b>" + esc(fechaLegible(cuerpo.as_of)) + "</b>, con la información " +
    "que tenía cargada ese día. Si la norma cambió después, todavía no lo sé.</div>";
}

function bloqueCobertura(lista){
  if(!lista || !lista.length) return "";
  const items = lista.slice(0, 6).map(function(c){
    return "<li>" + esc(c.norma) + (c.jurisdiccion ? " · " + esc(c.jurisdiccion) : "") +
      (c.titulo ? '<span class="titulo-norma">' + esc(c.titulo) + "</span>" : "") + "</li>";
  }).join("");
  const resto = lista.length > 6 ? "<li>y " + (lista.length - 6) + " norma(s) más</li>" : "";
  return '<h3>Lo que tengo publicado</h3><ul class="avisos">' + items + resto + "</ul>";
}

// Lo que se le dice a alguien que puede estar en una emergencia. Nunca
// diagnostica —«si esto es urgente», no «estás en una emergencia»— y nunca
// inventa un número: los canales son dato curado. Cuando no hay ninguno
// cargado lo dice, porque callarse sería peor.
const URGENCIA = {
  VIOLENCIA: "Si estás en peligro ahora, esto no reemplaza pedir ayuda.",
  SALUD: "Si es una emergencia de salud, esto no reemplaza pedir ayuda.",
  NINEZ: "Si hay chicos o chicas en riesgo ahora, esto no reemplaza pedir ayuda.",
  CALLE: "Si necesitás un lugar esta noche, esto no reemplaza pedir ayuda.",
  ALIMENTOS: "Si hoy no tenés qué comer, esto no reemplaza pedir ayuda."
};

function bloqueUrgencia(urgencia, canales){
  if(!urgencia || !urgencia.clase) return "";
  const linea = URGENCIA[urgencia.clase] || URGENCIA.CALLE;
  let html = '<div class="urgente"><h3>Antes que nada</h3><p>' + esc(linea) + "</p>";
  // Acá **no** se ofrecen los puntos de atención del corpus, y es a propósito.
  // Lo que hay cargado son sedes comunales y oficinas con horario: mandar ahí a
  // alguien cuyo hijo está en riesgo esta noche es peor que decirle que no
  // tengo, porque parece una respuesta y no lo es. Un canal de emergencia es
  // otra cosa —24 horas, con guardia— y el corpus todavía no distingue una cosa
  // de la otra: no hay campo que lo diga.
  html += "<p><b>No tengo cargado a quién llamar para una emergencia, y eso es una falla " +
    "de este sistema, no tuya.</b> Si podés, preguntá en el municipio o en una " +
    "organización del barrio.</p>";
  if(canales && canales.length){
    html += "<p>Los lugares que sí tengo son oficinas de atención con horario: están " +
      "más abajo, y sirven para el trámite, no para esta noche.</p>";
  }
  return html + "</div>";
}

function bloqueCanales(canales){
  let html = "<h3>A dónde ir</h3>";
  if(canales && canales.length){
    canales.slice(0, 2).forEach(function(p){
      html += '<div class="canal"><span class="nombre">' + esc(p.nombre) + "</span>" +
        '<span class="org">' + esc(p.organismo || "") + "</span>" +
        (p.direccion ? '<span class="dir">' + esc(p.direccion) +
          (p.localidad ? ", " + esc(p.localidad) : "") + "</span>" : "");
      const cs = (p.canales || []).filter(function(c){ return c && (c.valor || c.tipo); });
      if(cs.length){
        html += "<ul>" + cs.slice(0, 3).map(function(c){
          return "<li>" + esc((c.tipo || "") + ": " + (c.valor || "")) + "</li>";
        }).join("") + "</ul>";
      }
      // Cuándo se verificó, o que no consta. Un teléfono verificado hace dos
      // años y uno de la semana pasada no son lo mismo, y quien está por
      // llamar es quien tiene que saber cuál de los dos es.
      html += '<span class="verificado">' + (p.verificado_en
        ? "Lo verifiqué el " + esc(fechaLegible(p.verificado_en))
        : "No tengo fecha de cuándo se verificó esto. Confirmalo antes de ir.") + "</span>";
      html += "</div>";
    });
    html += '<p class="ayuda">Quien decide sobre tu caso es el organismo, no esta pantalla.</p>';
  }else{
    html += '<p class="ayuda">No tengo cargado ningún lugar de atención para esa zona. ' +
      "No quiere decir que no exista: quiere decir que yo todavía no lo tengo.</p>";
  }
  return html;
}

// --- cerrar el ciclo --------------------------------------------------------
//
// Todo lo que el sistema medía lo medía de sí mismo: latencia, abstenciones,
// evidencias. Nada decía si a la persona le sirvió. Estos tres botones son la
// única forma que tiene de contestar, y son tres a propósito: una caja de texto
// debajo de una respuesta sobre desalojos es donde alguien escribe su caso
// completo, y este sistema está construido para no guardar eso.
async function enviarDevolucion(senal, requestId){
  try{
    const r = await fetch("/v1/devoluciones", {
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify({request_id: requestId, senal: senal})
    });
    return r.ok;
  }catch(_){ return false; }
}

const GRACIAS = {
  SIRVIO: ["Gracias. Es la única forma que tengo de saber que algo de esto sirvió."],
  NO_SIRVIO: [
    "Gracias por decírmelo. Queda anotado que esta respuesta no sirvió. Lo que escribiste " +
    "no queda: eso no se guarda.",
    "Si querés, probá contándome lo mismo con otras palabras: a veces cambia lo que encuentro."
  ]
};

// Lo que se le dice a quien pide hablar con una persona. Lo primero es lo que
// esta pantalla **no** puede hacer, y la razón es la misma por la que no guarda
// nada: no te pide tus datos, así que no tiene a dónde escribirte. Prometer un
// contacto que no existe sería del mismo tipo de daño que inventar un teléfono.
const SIN_VUELTA =
  "No puedo comunicarte con alguien desde acá: no te pido tus datos, así que no tengo " +
  "a dónde escribirte ni a quién avisarle que estás esperando.";

function textoDePersona(hayCanales){
  return hayCanales
    ? [SIN_VUELTA,
       "Los lugares que tengo publicados están acá arriba, en «A dónde ir». Ahí sí atiende " +
       "gente, y son los que puedo mostrarte porque están cargados y verificados."]
    : [SIN_VUELTA,
       "Y todavía no tengo cargado ningún lugar de atención para mostrarte, que es una falla " +
       "de este sistema y no tuya.",
       "Que lo hayas pedido queda registrado —sin tu consulta y sin nada tuyo—, y es lo que " +
       "se mira para saber cuánta falta hace que atienda una persona."];
}

function bloqueDeCierre(requestId, canales){
  // Sin identificador no hay nada que registrar, y un botón que no puede hacer
  // lo que promete es peor que no ofrecerlo.
  if(!requestId) return null;
  const caja = document.createElement("div");
  caja.className = "cierre";
  caja.setAttribute("role", "group");
  caja.setAttribute("aria-label", "¿Te sirvió esta respuesta?");

  const rotulo = document.createElement("span");
  rotulo.className = "rotulo";
  rotulo.textContent = "¿Te sirvió?";
  caja.appendChild(rotulo);

  const hayCanales = !!(canales && canales.length);

  function agradecer(lineas){
    const gracias = document.createElement("div");
    gracias.className = "cierre-gracias";
    gracias.setAttribute("role", "status");
    lineas.forEach(function(linea){
      const p = document.createElement("p");
      p.textContent = linea;
      gracias.appendChild(p);
    });
    if(caja.parentNode) caja.parentNode.replaceChild(gracias, caja);
    return gracias;
  }

  function boton(texto, senal, clase){
    const b = chip(texto, async function(){
      Array.prototype.forEach.call(caja.querySelectorAll("button"), function(otro){
        otro.disabled = true;
      });
      const fue = await enviarDevolucion(senal, requestId);
      if(!fue){
        // No se inventa un «gracias» por algo que no se registró.
        rotulo.textContent = "No pude registrar tu respuesta. Probá de nuevo.";
        Array.prototype.forEach.call(caja.querySelectorAll("button"), function(otro){
          otro.disabled = false;
        });
        return;
      }
      if(senal === "QUIERE_PERSONA"){
        agradecer(textoDePersona(hayCanales));
        return;
      }
      const gracias = agradecer(GRACIAS[senal]);
      // Después de un «no», la salida a una persona sigue disponible: es
      // justamente ahí donde más hace falta.
      if(senal === "NO_SIRVIO"){
        const otra = chip("Quiero hablar con una persona", async function(){
          otra.disabled = true;
          if(!(await enviarDevolucion("QUIERE_PERSONA", requestId))){
            otra.disabled = false;
            return;
          }
          const caja2 = document.createElement("div");
          caja2.className = "cierre-gracias";
          caja2.setAttribute("role", "status");
          textoDePersona(hayCanales).forEach(function(linea){
            const p = document.createElement("p");
            p.textContent = linea;
            caja2.appendChild(p);
          });
          gracias.parentNode.replaceChild(caja2, gracias);
        });
        otra.className = "ficha-btn";
        gracias.appendChild(otra);
      }
    });
    b.className = "ficha-btn" + (clase ? " " + clase : "");
    b.setAttribute("data-senal", senal);
    return b;
  }

  caja.appendChild(boton("Sí", "SIRVIO"));
  caja.appendChild(boton("No", "NO_SIRVIO"));
  caja.appendChild(boton("Quiero hablar con una persona", "QUIERE_PERSONA", "persona"));
  return caja;
}

function responderEnElHilo(cuerpo, canales, requestId){
  const orientacion = cuerpo.orientacion;
  const modo = cuerpo.modo || "ERROR";
  const marca = nMensajes + 1;
  const titulo = (MODOS[modo] || ["Respuesta", "", ""])[0];
  const etiqueta = (MODOS[modo] || ["", "", ""])[1];
  const explicacion = (MODOS[modo] || ["", "", ""])[2];

  const indice = {};
  (cuerpo.fuentes || []).forEach(function(f, i){
    indice[String(f.chunk_id).toLowerCase()] = i + 1;
  });

  // Antes del título, antes del modo, antes de todo: si el mensaje parecía una
  // emergencia, eso se lee primero.
  let html = bloqueUrgencia(cuerpo.urgencia, canales);
  html += '<h2 id="titulo-respuesta" tabindex="-1">' + esc(titulo) +
    ' <span class="sello s-' + esc(modo) + '" aria-hidden="true">' + esc(etiqueta) + "</span></h2>" +
    '<p class="ayuda">' + esc(explicacion) + "</p>";

  if(modo === "ABSTENCION"){
    html += "<p>" + esc(cuerpo.texto) + "</p>";
    if(cuerpo.alternativa) html += "<p>" + esc(cuerpo.alternativa) + "</p>";
    html += bloqueCobertura(cuerpo.cobertura);
  }else{
    // La diferencia entre «esto contesta tu pregunta» y «esto se le parece» es
    // justamente lo que quien consulta no puede averiguar solo.
    if(cuerpo.solo_parecidos){
      html += '<div class="alerta"><b>Ojo: esto puede no tener nada que ver con lo tuyo.</b>' +
        "Ninguno de estos textos usa las palabras que escribiste. Los traje porque el tema " +
        "se parece, nada más. Leelos antes de darlos por buenos.</div>";
      html += bloqueCobertura(cuerpo.cobertura);
    }
    html += textoPlegado(cuerpo.texto || "", indice, marca);
    html += listaDeFuentes(cuerpo.fuentes || [], marca);
    html += listaDeAvisos(cuerpo);
  }
  html += bloqueCanales(canales);
  html += fichaDeDatos(cuerpo);

  const nodo = agregarMensaje("suyo", "ACIJ Acceso", html, true);
  // Después de la evidencia y antes de las sugerencias: primero de dónde sale,
  // después qué significa para su caso. Al revés se lee como un veredicto con
  // las fuentes de adorno abajo.
  if(orientacion){
    const bloque = bloqueOrientacion(orientacion);
    if(bloque){
      nodo.classList.add("con-orientacion");
      nodo.querySelector(".burbuja").appendChild(bloque);
    }
    if(orientacion.pregunta){
      nodo.querySelector(".burbuja").appendChild(cajaDePregunta(orientacion.pregunta));
    }
  }
  nodo.appendChild(sugerenciasDeSeguimiento());
  // Al final de todo: primero lo que la persona puede seguir preguntando, y
  // recién después la pregunta por la respuesta que acaba de leer.
  const cierre = bloqueDeCierre(requestId, canales);
  if(cierre) nodo.appendChild(cierre);
}

function errorEnElHilo(titulo, detalle, reintentable){
  agregarMensaje("suyo", "ACIJ Acceso",
    '<h2 id="titulo-respuesta" tabindex="-1">' + esc(titulo) +
    ' <span class="sello s-ERROR" aria-hidden="true">no anduvo</span></h2><p>' +
    esc(detalle) + "</p>", true);
  $("reintentar").hidden = !reintentable;
}

// --- lo que el sistema tiene en cuenta --------------------------------------
function pintarContexto(){
  const fichas = $("contexto-fichas");
  fichas.innerHTML = "";
  const puestas = [];
  if(contexto.jurisdiccion){
    puestas.push(["jurisdiccion", "Jurisdicción: " + contexto.jurisdiccionNombre]);
  }
  if(contexto.fecha){
    puestas.push(["fecha", "Fecha: " + fechaLegible(contexto.fecha)]);
  }
  // El programa que la persona eligió cuando la consulta tocaba varios. Va acá
  // y no escondido en la sesión: un supuesto que el sistema arrastra sin
  // mostrarlo es donde estos sistemas empiezan a mentir. Se muestra el nombre;
  // el código es nuestro y no se pinta.
  if(contexto.programa){
    puestas.push(["programa", "Programa: " + contexto.programaNombre]);
  }
  $("contexto").hidden = puestas.length === 0;
  puestas.forEach(function(par){
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ficha-btn puesta";
    b.innerHTML = esc(par[1]) + '<span class="quitar" aria-hidden="true">×</span>';
    b.setAttribute("aria-label", "Dejar de tener en cuenta " + par[1]);
    b.addEventListener("click", function(){
      if(par[0] === "jurisdiccion"){
        contexto.jurisdiccion = null; contexto.jurisdiccionNombre = null;
      }else if(par[0] === "programa"){
        contexto.programa = null; contexto.programaNombre = null;
        // Sacarlo de la pantalla sin sacarlo de la conversación lo dejaría
        // actuando por atrás en la próxima consulta.
        if(sesion) olvidarPrograma();
      }else{ contexto.fecha = null; }
      pintarContexto();
      mostrarEstado("Listo, ya no lo tengo en cuenta.");
    });
    fichas.appendChild(b);
  });
}

function chip(texto, alPulsar){
  const b = document.createElement("button");
  b.type = "button";
  b.className = "ficha-btn";
  b.textContent = texto;
  b.addEventListener("click", alPulsar);
  return b;
}

// --- la conversación: lo que se guarda, y que se pueda corregir --------------
//
// Hasta acá la pantalla no guardaba nada y lo decía. Ahora guarda lo que la
// persona **confirma** —no lo que escribe— y también lo dice, con el plazo y
// con el botón para borrarlo. El identificador de la conversación vive sólo en
// memoria: no va a `localStorage` ni a una cookie, así que recargar la página
// empieza de cero aunque la sesión del servidor siga viva hasta que vence.
let sesion = null;              // {sesion_id, vence_en, version, hechos, intencion}

async function abrirSesion(){
  if(sesion) return sesion;
  try{
    const r = await fetch("/v1/sesiones", {method:"POST", headers:{"Accept":"application/json"}});
    if(!r.ok) return null;
    sesion = await r.json();
    pintarRepaso();
    return sesion;
  }catch(_){
    // Sin conversación se puede consultar igual: lo que no hay es orientación.
    return null;
  }
}

function cerrarSesion(){
  sesion = null;
  // El programa elegido vivía en la conversación: sin conversación no sigue
  // elegido. Dejarlo en la franja de contexto sería mostrar como vigente algo
  // que el servidor ya no tiene.
  contexto.programa = null;
  contexto.programaNombre = null;
  pintarContexto();
  pintarRepaso();
}

// La sesión venció mientras la persona miraba la pantalla. No se resucita ni se
// abre otra por atrás: se dice, y la próxima consulta empieza una nueva.
function avisarVencida(){
  cerrarSesion();
  // Lo que está en pantalla se calculó con datos que ya no existen. Igual que
  // al borrarlos a mano: se marca, no se esconde.
  marcarReemplazadas();
  agregarMensaje("suyo", "ACIJ Acceso",
    '<h2 tabindex="-1">Se cerró la conversación</h2>' +
    "<p>Pasó media hora sin que la usaras, o ya llevaba dos horas abierta. Borré lo que " +
    "habías confirmado, que era el trato. Lo que leíste sigue en pantalla hasta que cierres " +
    "o borres; si querés seguir, escribime de nuevo y arrancamos otra.</p>", true);
}

// Usa la conversación abierta; **no abre una**. Abrirla es cosa de mandar un
// mensaje. Si esto la abriera, apretar un botón de una respuesta vieja después
// de que la conversación venció arrancaría otra sin que la persona lo pida, y
// guardaría ahí un dato que contestó en otra.
async function conSesion(hacer){
  if(!sesion){
    mostrarEstado("Esa conversación ya se cerró. Escribime de nuevo y arrancamos otra.");
    return null;
  }
  try{
    const r = await hacer(sesion.sesion_id);
    if(r.status === 404){ avisarVencida(); return null; }
    if(!r.ok) return null;
    if(r.status === 204) return null;
    sesion = await r.json();
    pintarRepaso();
    return sesion;
  }catch(_){ return null; }
}

function ponerHecho(datos){
  return conSesion(function(id){
    return fetch("/v1/sesiones/" + encodeURIComponent(id) + "/hechos", {
      method:"PUT",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify(datos)
    });
  });
}

function guardarHecho(clave, valor, texto){
  return ponerHecho({clave: clave, valor: valor, origen: "declarado", texto: texto || null});
}

function rehusarHecho(clave, texto){
  return ponerHecho({clave: clave, rehusado: true, texto: texto || null});
}

function olvidarHecho(clave){
  return conSesion(function(id){
    return fetch("/v1/sesiones/" + encodeURIComponent(id) + "/hechos/" + encodeURIComponent(clave),
      {method:"DELETE", headers:{"Accept":"application/json"}});
  });
}

function elegirBeneficio(codigo){
  return conSesion(function(id){
    return fetch("/v1/sesiones/" + encodeURIComponent(id) + "/contexto", {
      method:"PATCH",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify({intencion: codigo})
    });
  });
}

// Deshacer la elección tiene ruta propia: mandar `null` al PATCH significaría
// «no lo toques», y el programa seguiría acotando cada consulta después de que
// la persona lo sacó de la pantalla.
function olvidarPrograma(){
  return conSesion(function(id){
    return fetch("/v1/sesiones/" + encodeURIComponent(id) + "/contexto/intencion",
      {method:"DELETE", headers:{"Accept":"application/json"}});
  });
}

// Devuelve si el servidor confirmó el borrado. Importa: la pantalla promete
// que se borra en el momento, y si no se pudo hay que decirlo en vez de dejar
// a la persona creyendo que sí.
async function borrarConversacion(){
  if(!sesion) return true;
  const id = sesion.sesion_id;
  cerrarSesion();
  try{
    const r = await fetch("/v1/sesiones/" + encodeURIComponent(id), {method:"DELETE"});
    return r.ok;
  }catch(_){ return false; }
}

// Borra lo confirmado y deja el hilo. No es lo mismo que «Salir y borrar», que
// además limpia la pantalla: alguien puede querer sacar sus datos y seguir
// leyendo lo que ya le contestaron. Lo que se leyó queda marcado como
// reemplazado, porque se calculó con datos que ya no están.
async function borrarLosDatos(){
  if(!sesion){ mostrarEstado("No hay nada confirmado para borrar."); return; }
  const listo = await borrarConversacion();
  marcarReemplazadas();
  mostrarEstado(listo
    ? "Listo, borré lo que habías confirmado. Lo de arriba se calculó con eso, así que ya no vale."
    : "No pude confirmar el borrado en el servidor. Se borra solo a la media hora sin usarlo.");
}

// --- lo que la persona confirmó ---------------------------------------------
// Los valores que la norma enumera vienen en mayúsculas y con guiones bajos:
// son su vocabulario, no una etiqueta para leer.
function opcionLegible(valor){
  const limpio = String(valor).replace(/_/g, " ").toLowerCase();
  return limpio.charAt(0).toUpperCase() + limpio.slice(1);
}

function valorLegible(dato){
  if(dato.rehusado) return "Preferiste no contestar";
  const v = dato.valor;
  if(v === true) return "Sí";
  if(v === false) return "No";
  if(v === null || v === undefined) return "Sin dato";
  if(typeof v === "number") return String(v);
  return opcionLegible(v);
}

function pintarRepaso(){
  const caja = $("repaso");
  const lista = $("repaso-lista");
  const hechos = (sesion && sesion.hechos) || {};
  const claves = Object.keys(hechos);
  caja.hidden = claves.length === 0;
  lista.innerHTML = "";
  claves.forEach(function(clave){
    const dato = hechos[clave];
    const li = document.createElement("li");
    const dicho = document.createElement("div");
    dicho.className = "dicho";
    // Lo que se muestra es el texto de la norma. La clave del campo es interna
    // y no aparece nunca: es el modelo de datos, no algo que alguien preguntó.
    dicho.innerHTML = '<span class="valor">' + esc(valorLegible(dato)) + "</span> — " +
      esc(dato.texto || "un dato que confirmaste") +
      '<span class="origen">' +
      (dato.origen === "inferido" ? "lo deduje yo, no me lo dijiste" : "me lo dijiste vos") +
      "</span>";
    li.appendChild(dicho);
    // Corregir es volver a preguntar, no editar el valor a ciegas: la forma de
    // la respuesta —sí o no, un número, una de varias opciones— la sabe la
    // regla, no esta pantalla. Se saca el dato y la pregunta vuelve como era.
    li.appendChild(chip(dato.rehusado ? "Contestarlo ahora" : "Cambiar", async function(){
      await olvidarHecho(clave);
      marcarReemplazadas();
      mostrarEstado("Lo saqué y te lo vuelvo a preguntar.");
      if(ultimoEnvio) consultar(ultimoEnvio);
    }));
    lista.appendChild(li);
  });
}

// Una respuesta calculada con un dato que después cambió no se borra: se marca.
// Borrarla dejaría a la persona sin saber que lo que leyó ya no vale; dejarla
// como estaba la dejaría creyendo que sigue valiendo.
function marcarReemplazadas(){
  document.querySelectorAll(".msj.con-orientacion:not(.reemplazada)").forEach(function(nodo){
    nodo.classList.add("reemplazada");
    // Y sus controles dejan de andar. Un botón que sigue contestando adentro de
    // un bloque marcado como «esto ya no vale» vuelve a escribir el dato viejo.
    nodo.querySelectorAll(".pregunta button, .pregunta input").forEach(function(control){
      control.disabled = true;
    });
    const nota = document.createElement("p");
    nota.className = "reemplazo";
    nota.textContent = "Cambiaste un dato después de esto. Lo de acá arriba se calculó con el " +
      "anterior, así que ya no vale: mirá la respuesta de más abajo.";
    nodo.querySelector(".burbuja").prepend(nota);
  });
}

// --- orientación: lo que las reglas dicen con lo que la persona contó -------
//
// Cada palabra de acá está elegida para que no se lea como una decisión. No hay
// «te corresponde», no hay «no te corresponde», no hay «cumplís los
// requisitos». Hay condiciones, y en qué estado quedó cada una con lo que la
// persona dijo hasta ahora.
const RESULTADOS = {
  POTENCIALMENTE_APLICABLE:
    "Con lo que me contaste, no encontré nada en las normas que te deje afuera. " +
    "Eso no es un sí: el organismo mira cosas que yo no veo.",
  NO_CUMPLE_REGLA_EXPLICITA:
    "Con lo que me contaste, hay una condición escrita en la norma que no se cumple. " +
    "Eso no es un no: si te parece que el dato quedó mal cargado, cambialo acá abajo, " +
    "y de todas formas quien decide es el organismo.",
  REQUIERE_DATOS:
    "Con lo que me contaste todavía me falta saber algo para poder decirte cómo va. " +
    "Si aparece una condición marcada como que no se cumple, ojo: no la leas como un no, " +
    "porque mientras quede algo sin saber esto no dice ni que sí ni que no.",
  REQUIERE_REVISION:
    "Con lo que me contaste no me alcanza para decir nada firme: parte de lo que la norma " +
    "exige todavía no lo tengo escrito de una forma que pueda evaluar."
};

const MOTIVOS = {
  sin_fragmentos: "No encontré textos publicados sobre esto, así que no tengo condiciones que mirar.",
  sin_beneficio: "Los textos que encontré no cuelgan de ningún programa que tenga publicado.",
  sin_reglas: "Tengo el programa publicado, pero todavía no tengo sus condiciones cargadas como para revisarlas una por una."
};

function listaDeCondiciones(rotulo, clase, condiciones){
  if(!condiciones || !condiciones.length) return "";
  let html = '<div class="grupo"><span class="rotulo ' + clase + '">' + esc(rotulo) + "</span><ul>";
  condiciones.forEach(function(c){
    html += "<li>" + esc(c.texto_literal) +
      (c.alcance ? ' <span class="origen">(' + esc(c.alcance) + ")</span>" : "") + "</li>";
  });
  return html + "</ul></div>";
}

// Cuando la consulta toca más de un programa, el sistema no elige: pregunta.
// Elegir por cantidad de párrafos parecidos sería decidir por la persona cuál
// de dos programas es el suyo.
function cajaDeEleccion(candidatos){
  const caja = document.createElement("div");
  caja.className = "pregunta";
  const p = document.createElement("p");
  p.className = "enunciado";
  p.textContent = "Encontré textos de más de un programa. No elijo yo cuál es el tuyo: " +
    "¿sobre cuál querés que mire las condiciones?";
  caja.appendChild(p);
  const fichas = document.createElement("div");
  fichas.className = "fichas";
  candidatos.forEach(function(c){
    fichas.appendChild(chip(c.nombre, async function(){
      await elegirBeneficio(c.codigo);
      contexto.programa = c.codigo;
      contexto.programaNombre = c.nombre;
      pintarContexto();
      mostrarEstado("Listo, miro ese.");
      if(ultimoEnvio) consultar(ultimoEnvio);
    }));
  });
  caja.appendChild(fichas);
  return caja;
}

// La pregunta: el texto de la norma arriba, el control abajo, y siempre la
// salida de no contestar. Una sola por vez.
function cajaDePregunta(pregunta){
  const caja = document.createElement("div");
  caja.className = "pregunta";

  if(pregunta.texto_literal){
    const dice = document.createElement("p");
    dice.className = "dice";
    dice.textContent = "La norma dice: «" + pregunta.texto_literal + "»";
    caja.appendChild(dice);
  }
  const enunciado = document.createElement("p");
  enunciado.className = "enunciado";
  enunciado.textContent = pregunta.forma === "si_no"
    ? "¿Eso pasa en tu caso?"
    : (pregunta.forma === "opciones" ? "¿Cuál de estas es la tuya?" : "¿Qué valor te corresponde ahí?");
  caja.appendChild(enunciado);

  const guardar = async function(valor){
    await guardarHecho(pregunta.campo, valor, pregunta.texto_literal);
    marcarReemplazadas();
    if(ultimoEnvio) consultar(ultimoEnvio);
  };

  const fichas = document.createElement("div");
  fichas.className = "fichas";
  if(pregunta.forma === "si_no"){
    fichas.appendChild(chip("Sí", function(){ guardar(true); }));
    fichas.appendChild(chip("No", function(){ guardar(false); }));
  }else if(pregunta.forma === "opciones"){
    (pregunta.opciones || []).forEach(function(op){
      fichas.appendChild(chip(opcionLegible(op), function(){ guardar(op); }));
    });
  }else{
    const campo = document.createElement("input");
    campo.type = pregunta.forma === "fecha" ? "date" : "number";
    campo.id = "respuesta-" + Math.random().toString(36).slice(2, 8);
    campo.setAttribute("aria-label", "Tu respuesta");
    caja.appendChild(campo);
    if(pregunta.unidad){
      const u = document.createElement("span");
      u.className = "unidad";
      u.textContent = "en " + pregunta.unidad;
      caja.appendChild(u);
    }
    fichas.appendChild(chip("Guardar", function(){
      if(campo.value === "") return;
      guardar(pregunta.forma === "fecha" ? campo.value : Number(campo.value));
    }));
  }
  // No contestar es una respuesta, y una que el sistema respeta: la condición
  // queda desconocida —no en contra— y no se vuelve a preguntar.
  fichas.appendChild(chip("Prefiero no contestar", async function(){
    await rehusarHecho(pregunta.campo, pregunta.texto_literal);
    if(ultimoEnvio) consultar(ultimoEnvio);
  }));
  caja.appendChild(fichas);
  return caja;
}

// Lo que una condición bloqueante significa según de qué tipo sea. La
// diferencia no es un detalle: «no cumplís esto» y «esto que cumplís te deja
// afuera» se leen distinto y llevan a hacer cosas distintas.
const BLOQUEO = {
  APLICABILIDAD: "La norma pide esto y, con lo que me contaste, no se cumple:",
  EXCLUSION: "Esto que me contaste es, según la norma, algo que deja afuera:"
};

const ESTADO_EXCEPCION = {
  TRUE: ["alcanza", "Y por lo que me contaste, esta excepción te alcanza."],
  UNKNOWN: ["falta", "No sé todavía si esta excepción te alcanza."],
  FALSE: ["no-alcanza", "Por lo que me contaste, esta excepción no te alcanza."]
};

// Las vías de subsanación: lo que la norma prevé para levantar un bloqueo.
//
// Es la parte de la pantalla que más puede cambiarle el día a alguien. El motor
// ya se negaba a informar una negativa sin evaluar las excepciones; lo que no
// hacía era **decir cuál**, y esa excepción suele ser la vía que le queda.
function bloqueDeSalidas(subsanaciones){
  if(!subsanaciones || !subsanaciones.length) return "";
  let html = '<div class="grupo"><span class="rotulo r-falta">Lo que te frena, y qué prevé la norma</span>';
  subsanaciones.forEach(function(s){
    html += '<div class="salida"><p class="bloqueo">' +
      esc(BLOQUEO[s.categoria] || "Con lo que me contaste, esto te frena:") +
      " <b>" + esc(s.condicion) + "</b></p>";
    const excepciones = s.excepciones || [];
    if(!excepciones.length){
      // Que no haya ninguna registrada no es que la norma no la prevea. La
      // diferencia entre «la ley no deja salida» y «yo no tengo la salida
      // cargada» es enorme, y decir la primera cuando pasa la segunda sería
      // cerrarle a alguien una puerta que está abierta.
      html += '<p class="sin-salida">No tengo cargada ninguna excepción para esto. Eso no ' +
        "quiere decir que la norma no prevea ninguna: quiere decir que yo no la tengo. " +
        "Preguntá en el organismo antes de darlo por cerrado.</p>";
    }else{
      html += "<p class=\"sin-salida\">La norma prevé estas excepciones:</p><ul>";
      excepciones.forEach(function(e){
        const par = ESTADO_EXCEPCION[e.estado] || ESTADO_EXCEPCION.UNKNOWN;
        html += "<li>" + esc(e.texto_literal) +
          ' <span class="' + par[0] + '">' + esc(par[1]) + "</span></li>";
      });
      html += "</ul>";
    }
    html += "</div>";
  });
  return html + "</div>";
}

// Los próximos pasos. Es lo único accionable de toda la respuesta, así que va
// al final y con el aviso de que no inicia nada: un sistema que le hace creer a
// alguien que ya hizo el trámite le hace perder el plazo.
const ORIGEN_DEL_PASO = {
  conversacion: "Acá mismo",
  norma: "Lo dice la norma",
  tramite: "Lo pide el organismo"
};

function bloqueDePasos(pp){
  if(!pp) return "";
  const pasos = pp.pasos || [];
  let html = '<div class="grupo pasos"><span class="rotulo">Qué podés hacer ahora</span>';
  if(pasos.length){
    html += "<ol>";
    pasos.forEach(function(p){
      html += "<li>" + esc(p.accion) +
        (p.respaldo ? '<span class="respaldo">' + esc(ORIGEN_DEL_PASO[p.origen] || "") +
          ": «" + esc(p.respaldo) + "»</span>" : "") + "</li>";
    });
    html += "</ol>";
  }else{
    html += "<p>No tengo ningún paso concreto para darte todavía.</p>";
  }
  if(pp.sin_tramite_publicado){
    // Callarlo haría pasar por «no hay nada que hacer» lo que en realidad es
    // «no lo tengo cargado».
    html += "<p class=\"respaldo\">Los pasos que pide el organismo para este programa " +
      "todavía no los tengo cargados. Preguntá ahí cuáles son: no son estos.</p>";
  }
  html += '<p class="no-inicia">' + esc(pp.aclaracion || "") + "</p>";
  return html + "</div>";
}

function bloqueOrientacion(o){
  const caja = document.createElement("div");
  caja.className = "orienta";

  if(!o.resultado){
    if(o.motivo_sin_evaluar === "varios_beneficios" && (o.candidatos || []).length){
      return cajaDeEleccion(o.candidatos);
    }
    const p = document.createElement("p");
    p.textContent = MOTIVOS[o.motivo_sin_evaluar] || "";
    if(!p.textContent) return null;
    caja.innerHTML = "<h3>Por qué no puedo mirar las condiciones</h3>";
    caja.appendChild(p);
    return caja;
  }

  let html = "<h3>Cómo va tu caso contra lo que pide la norma</h3>" +
    '<span class="programa">' + esc(o.beneficio || "") + "</span>" +
    "<p>" + esc(RESULTADOS[o.resultado] || "") + "</p>";
  html += listaDeCondiciones("Se cumple con lo que me contaste", "r-cumple", o.condiciones_cumplidas);
  html += listaDeCondiciones("No se cumple con lo que me contaste", "r-no", o.condiciones_no_cumplidas);
  html += listaDeCondiciones("Todavía no lo sé", "r-falta", o.condiciones_desconocidas);
  html += bloqueDeSalidas(o.subsanaciones);
  html += listaDeCondiciones("A tener en cuenta igual", "r-falta", o.salvaguardas);
  if(o.sin_preguntar > 0){
    html += '<div class="alerta"><b>Hay ' + o.sin_preguntar + " requisito(s) que no te puedo " +
      "preguntar todavía.</b>El texto de la norma pide varias cosas en una misma oración y no " +
      "tengo forma de saber cuál te estaría preguntando. Prefiero no preguntar mal: quedan " +
      "como desconocidos y por eso la orientación es incompleta.</div>";
  }
  html += bloqueDePasos(o.proximos_pasos);
  html += '<p class="ayuda">' + esc(o.aclaracion || "") + "</p>";
  caja.innerHTML = html;
  return caja;
}

function sugerenciasDeSeguimiento(){
  const caja = document.createElement("div");
  caja.className = "fichas";
  if(!contexto.jurisdiccion && jurisdicciones.length){
    caja.appendChild(chip("Buscar sólo donde vivo", function(){ pedirJurisdiccion(caja); }));
  }
  if(!contexto.fecha){
    caja.appendChild(chip("Ver qué decía antes", function(){ pedirFecha(caja); }));
  }
  return caja;
}

function pedirJurisdiccion(caja){
  caja.innerHTML = "";
  const titulo = document.createElement("p");
  titulo.className = "ayuda";
  titulo.textContent = "¿Dónde vivís, o dónde vas a hacer el trámite?";
  caja.appendChild(titulo);
  const fichas = document.createElement("div");
  fichas.className = "fichas";
  jurisdicciones.slice(0, 30).forEach(function(j){
    fichas.appendChild(chip(j.nombre, function(){
      contexto.jurisdiccion = j.id;
      contexto.jurisdiccionNombre = j.nombre;
      pintarContexto();
      if(sesion) conSesion(function(id){
        return fetch("/v1/sesiones/" + encodeURIComponent(id) + "/contexto", {
          method:"PATCH",
          headers:{"Content-Type":"application/json","Accept":"application/json"},
          body: JSON.stringify({jurisdiccion: j.id})
        });
      });
      if(ultimoEnvio) consultar({texto: ultimoEnvio.texto});
    }));
  });
  caja.appendChild(fichas);
  const primera = fichas.querySelector("button");
  if(primera) primera.focus();
}

function pedirFecha(caja){
  caja.innerHTML = "";
  const etiqueta = document.createElement("label");
  etiqueta.className = "ayuda";
  etiqueta.setAttribute("for", "fecha-otra");
  etiqueta.textContent = "¿Para qué día querés saber qué decía la norma?";
  const campo = document.createElement("input");
  campo.type = "date";
  campo.id = "fecha-otra";
  campo.addEventListener("change", function(){
    if(!campo.value) return;
    contexto.fecha = campo.value;
    pintarContexto();
    if(sesion) conSesion(function(id){
      return fetch("/v1/sesiones/" + encodeURIComponent(id) + "/contexto", {
        method:"PATCH",
        headers:{"Content-Type":"application/json","Accept":"application/json"},
        body: JSON.stringify({fecha: campo.value})
      });
    });
    if(ultimoEnvio) consultar({texto: ultimoEnvio.texto});
  });
  caja.appendChild(etiqueta);
  caja.appendChild(campo);
  campo.focus();
}

// --- apertura ---------------------------------------------------------------
function saludar(){
  // La bienvenida no es un mensaje del hilo: es la portada. Va sobre la página,
  // con el cuadro de escritura debajo, y desaparece en cuanto hay conversación.
  // Un chat que arranca con un mensaje del sistema ya parece usado antes de que
  // nadie lo use.
  const nodo = document.createElement("div");
  nodo.className = "msj suyo bienvenida";
  nodo.innerHTML =
    '<div class="burbuja">' +
    '<h2 tabindex="-1">Hola. Contame qué te está pasando.</h2>' +
    "<p>Escribilo como se lo contarías a alguien. No hace falta que sepas cómo se llama el " +
    "trámite ni qué ley es. Te voy a mostrar qué dicen las normas que tengo publicadas y de " +
    "dónde sale cada cosa, para que puedas llevárselo a quien te atienda.</p>" +
    '<div class="alerta aviso-privacidad"><b>Esto no decide si te corresponde.</b>' +
    "No te lo doy ni te lo niego: eso lo resuelve el organismo. Y no necesito tu nombre, tu " +
    "documento, tu dirección exacta ni datos de otra persona.</div>" +
    // Antes esta pantalla prometía «nada de lo que escribas se guarda». Dejó de
    // ser cierto en cuanto la conversación empezó a recordar los datos que la
    // persona confirma, y una promesa de privacidad que no se cumple es peor
    // que no haberla hecho. Lo que se guarda, por cuánto tiempo y cómo se borra
    // se dicen acá, en la portada, y no en un enlace al pie.
    '<div class="alerta aviso-privacidad"><b>Qué se guarda y por cuánto.</b>' +
    "Tus mensajes no se guardan. Sí se guardan los datos que <b>confirmes</b> cuando yo te " +
    "pregunte algo puntual —por ejemplo, si tenés un hijo a cargo—, para no volver a " +
    "preguntártelos y para poder mirar las condiciones de la norma con eso. Los vas a ver " +
    "listados en pantalla, los podés cambiar o sacar cuando quieras, y se borran solos a la " +
    "media hora sin usar la conversación, o a las dos horas de empezada. «Borrar estos datos» los saca en el " +
    "momento, y «Salir y borrar» borra además todo lo que está en pantalla.</div>" +
    bloqueCobertura(cobertura) +
    "</div>";
  $("resultado").appendChild(nodo);
  // Primero las situaciones, después los ejemplos escritos. Quien no sabe cómo
  // se llama lo que busca —que es casi todo el mundo— puede empezar por acá sin
  // tener que acertarle a una palabra.
  const porSituacion = bloqueDeNecesidades();
  if(porSituacion){
    const rotulo = document.createElement("p");
    rotulo.className = "ayuda";
    rotulo.textContent = "O contame en qué andás:";
    nodo.appendChild(rotulo);
    nodo.appendChild(porSituacion);
  }
  nodo.appendChild(sugerenciasDeEjemplo());
  document.body.classList.add("sin-conversacion");
}


function sugerenciasDeEjemplo(){
  const caja = document.createElement("div");
  caja.className = "fichas";
  // Las sugerencias salen de lo que el corte realmente cubre, no de una lista
  // escrita a mano: ofrecer ejemplos que el sistema no puede contestar es
  // prometer algo que no tiene.
  // Estas tres están **medidas**: las tres vuelven con textos que además
  // coinciden en palabras con lo publicado. Las anteriores —«¿Quién puede
  // pedirlo?», «¿Qué papeles piden?»— volvían con el aviso de «esto puede no
  // tener nada que ver», o sea que la pantalla sugería una pregunta y después
  // se desdecía de la respuesta. Una sugerencia que el sistema no puede
  // contestar bien es peor que no sugerir nada.
  //
  // Están escritas acá porque hoy lo publicado es una sola ley. Con más normas
  // esto tiene que salir del corpus, y verificarse igual: la regla no es la
  // lista, es que se prueben antes de ofrecerlas.
  const ejemplos = cobertura.length
    ? [
        "Me quedé sin casa después de un incendio",
        "Estoy durmiendo en la calle",
        "¿Tengo que rendir cuentas de lo que gasté?"
      ]
    : ["¿Qué tenés publicado?"];
  ejemplos.forEach(function(texto){
    caja.appendChild(chip(texto, function(){
      $("pregunta").value = texto;
      enviar();
    }));
  });
  return caja;
}

// --- orientar desde la situación (P-030) ------------------------------------
//
// Alguien que se quedó sin casa no sabe que lo que busca se llama «Programa de
// apoyo para personas en situación de vulnerabilidad habitacional». Sabe que no
// tiene dónde vivir.
//
// La necesidad la **elige** la persona: no se deduce de lo que escribió.
// Deducir de un mensaje que alguien tiene una discapacidad o está embarazada es
// inferir información sensible, y eso no se hace acá.
let necesidades = [];

async function cargarNecesidades(){
  try{
    const r = await fetch("/v1/necesidades", {headers:{"Accept":"application/json"}});
    if(!r.ok) return;
    necesidades = ((await r.json()).data || {}).necesidades || [];
  }catch(_){ necesidades = []; }
}

function bloqueDeNecesidades(){
  if(!necesidades.length) return null;
  const caja = document.createElement("div");
  caja.className = "fichas";
  necesidades.forEach(function(n){
    const b = chip(n.rotulo, function(){ mostrarOpciones(n); });
    if(n.detalle) b.title = n.detalle;
    caja.appendChild(b);
  });
  return caja;
}

async function mostrarOpciones(necesidad){
  mensajeMio(necesidad.rotulo);
  const portada = document.querySelector(".bienvenida");
  if(portada){ portada.remove(); }
  document.body.classList.remove("sin-conversacion");
  mostrarPensando();
  let datos = null;
  try{
    const q = contexto.jurisdiccion ? "?jurisdiccion=" + encodeURIComponent(contexto.jurisdiccion) : "";
    const r = await fetch("/v1/necesidades/" + encodeURIComponent(necesidad.familia) + "/opciones" + q,
      {headers:{"Accept":"application/json"}});
    if(r.ok) datos = (await r.json()).data;
  }catch(_){}
  sacarPensando();
  if(!datos){
    errorEnElHilo("No pude traer las opciones",
      "Ojo: no es que no haya nada. Es que no pude fijarme. Probá de nuevo.", true);
    return;
  }
  const nodo = agregarMensaje("suyo", "ACIJ Acceso",
    '<h2 tabindex="-1">' + esc(datos.rotulo || necesidad.rotulo) + "</h2>" +
    (datos.detalle ? '<p class="ayuda">' + esc(datos.detalle) + "</p>" : ""), true);
  const burbuja = nodo.querySelector(".burbuja");

  if(!(datos.opciones || []).length){
    const p = document.createElement("p");
    p.textContent = "No tengo nada publicado para esto todavía. Que no esté acá no quiere " +
      "decir que no te corresponda: preguntá igual en el organismo.";
    burbuja.appendChild(p);
    return;
  }
  datos.opciones.forEach(function(o){ burbuja.appendChild(cajaDeOpcion(o)); });

  // Siempre, y sin excepción: esto no es el catálogo completo. Presentarlo como
  // si lo fuera haría que alguien deje de buscar donde sí lo hay.
  const aviso = document.createElement("div");
  aviso.className = "alerta";
  aviso.innerHTML = "<b>Esto no es todo lo que existe.</b>" + esc(datos.aclaracion || "");
  burbuja.appendChild(aviso);
}

function cajaDeOpcion(o){
  const caja = document.createElement("div");
  caja.className = "opcion";
  let html = '<span class="nombre">' + esc(o.nombre) + "</span>";
  if(o.descripcion) html += "<p>" + esc(o.descripcion) + "</p>";
  // Por qué está en la lista. Nada de esto afirma nada sobre la persona: dice
  // de qué norma sale el programa y dónde rige.
  const partes = [];
  if(o.norma) partes.push("Sale de la " + o.norma);
  if(o.jurisdiccion) partes.push("rige en " + o.jurisdiccion);
  if(o.condiciones) partes.push(o.condiciones + " condición(es) para mirar");
  html += '<p class="porque">' + esc(partes.join(" · ")) + "</p>";
  if(o.coincide_jurisdiccion === false){
    html += '<p class="porque lejos">No es de donde me dijiste que vivís. Te lo muestro igual ' +
      "por si te sirve, o por si hay algo parecido donde estás.</p>";
  }
  caja.innerHTML = html;
  const fichas = document.createElement("div");
  fichas.className = "fichas";
  fichas.appendChild(chip("Ver mis condiciones para este", async function(){
    await abrirSesion();
    await elegirBeneficio(o.codigo);
    contexto.programa = o.codigo;
    contexto.programaNombre = o.nombre;
    pintarContexto();
    consultar({texto: o.nombre});
  }));
  caja.appendChild(fichas);
  return caja;
}

// --- vocabularios y cobertura ----------------------------------------------
async function cargarVocabularios(){
  try{
    const r = await fetch("/v1/vocabularios", {headers:{"Accept":"application/json"}});
    if(!r.ok) throw new Error("HTTP " + r.status);
    const cuerpo = await r.json();
    jurisdicciones = (cuerpo.data || {}).jurisdicciones || [];
    // La versión del contrato no se muestra: no le dice nada a quien pregunta.
  }catch(_){
    jurisdicciones = [];   // se puede preguntar igual, sin acotar
  }
}

async function cargarCobertura(){
  try{
    const r = await fetch("/v1/respuestas", {
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify({consulta:"qué hay publicado", limite:1})
    });
    if(!r.ok) return;
    cobertura = (await r.json()).cobertura || [];
  }catch(_){ cobertura = []; }
}

// --- canal oficial ----------------------------------------------------------
async function buscarCanales(jurisdiccion, senal){
  try{
    const q = jurisdiccion ? "?jurisdiccion=" + encodeURIComponent(jurisdiccion) : "";
    const r = await fetch("/v1/puntos-atencion" + q, {signal: senal});
    if(!r.ok) return [];
    return (await r.json()).data || [];
  }catch(_){ return []; }
}

// --- enviar -----------------------------------------------------------------
async function consultar(envio){
  ultimoEnvio = envio;
  $("reintentar").hidden = true;
  peticion = new AbortController();
  trabajando(true);
  mostrarPensando();

  const cuerpo = {consulta: envio.texto, limite: 5};
  if(contexto.jurisdiccion) cuerpo.jurisdiccion = contexto.jurisdiccion;
  // La conversación se abre en el primer envío y no antes: alguien que entra,
  // lee y se va no deja nada abierto en ningún lado.
  const abierta = await abrirSesion();
  if(abierta) cuerpo.sesion_id = abierta.sesion_id;
  const ruta = "/v1/respuestas" +
    (contexto.fecha ? "?as_of=" + encodeURIComponent(contexto.fecha) : "");

  try{
    const r = await fetch(ruta, {
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify(cuerpo),
      signal: peticion.signal
    });
    if(r.status === 422){
      errorEnElHilo("No te entendí",
        "Probá escribirlo de otra manera, un poco más corto.", true);
      mostrarEstado("");
      return;
    }
    if(!r.ok){
      errorEnElHilo("No pude contestarte ahora",
        "Ojo: no es que la respuesta sea que no te corresponde. Es que no pude fijarme. " +
        "Probá de nuevo en un momento.", true);
      mostrarEstado("");
      return;
    }
    const datos = await r.json();
    if(datos.sesion_vencida){
      // El servidor ya la borró. Se dice acá y no se abre otra a escondidas.
      sacarPensando();
      avisarVencida();
      return;
    }
    if(datos.cobertura && datos.cobertura.length) cobertura = datos.cobertura;
    const canales = await buscarCanales(contexto.jurisdiccion, peticion.signal);
    sacarPensando();
    mostrarEstado("");
    // La cabecera es lo que ata la devolución a esta respuesta sin que viaje
    // nada de lo que la persona escribió.
    responderEnElHilo(datos, canales, r.headers.get("X-Request-Id"));
  }catch(error){
    if(error && error.name === "AbortError"){
      sacarPensando();
      mostrarEstado("Listo, lo cancelé.");
      return;
    }
    errorEnElHilo("No llegué a conectarme",
      "Puede ser la conexión. Lo que escribiste sigue acá; probá de nuevo.", true);
    mostrarEstado("");
  }finally{
    sacarPensando();
    peticion = null;
    trabajando(false);
  }
}

function enviar(){
  const texto = $("pregunta").value.trim();
  if(!texto){
    mostrarEstado("Escribime qué querés saber y lo busco.");
    $("pregunta").focus();
    return;
  }
  const portada = document.querySelector(".bienvenida");
  if(portada){ portada.remove(); }
  document.body.classList.remove("sin-conversacion");
  mensajeMio(texto);
  $("pregunta").value = "";
  ajustarAlto();
  consultar({texto: texto});
}

function ajustarAlto(){
  const caja = $("pregunta");
  caja.style.height = "auto";
  caja.style.height = Math.min(180, caja.scrollHeight) + "px";
}

// --- el resumen para llevar --------------------------------------------------
//
// La pantalla promete desde la portada que lo que leyó se lo pueda llevar «a
// quien te atienda». Esto lo cumple.
//
// **Se arma en el navegador y no sale de la máquina.** No hay una ruta que
// genere el resumen en el servidor: eso obligaría a mandar de vuelta lo que la
// persona leyó, y no hace falta —está todo en la pantalla—. Es voluntario: sale
// sólo si alguien lo pide.
//
// **No parece un papel oficial y lo dice en la primera línea.** Un resumen que
// se ve como una constancia es un resumen que alguien va a presentar creyendo
// que vale, y no vale: no inicia trámite ni crea expediente.
function textoDelResumen(){
  const lineas = [];
  lineas.push("LO QUE LEÍ EN ACIJ ACCESO");
  lineas.push("");
  lineas.push("Esto NO es una constancia, NO inicia ningún trámite y NO crea expediente.");
  lineas.push("Es una copia de lo que leí en pantalla, para poder mostrarlo.");
  lineas.push("Quien decide sobre mi caso es el organismo.");
  lineas.push("");
  lineas.push("Lo bajé el " + fechaLegible(new Date().toISOString().slice(0, 10)) + ".");
  if(contexto.programaNombre) lineas.push("Programa: " + contexto.programaNombre);
  if(contexto.jurisdiccionNombre) lineas.push("Jurisdicción: " + contexto.jurisdiccionNombre);
  lineas.push("");

  const hechos = (sesion && sesion.hechos) || {};
  const claves = Object.keys(hechos);
  if(claves.length){
    lineas.push("LO QUE CONFIRMÉ");
    claves.forEach(function(clave){
      const d = hechos[clave];
      lineas.push("- " + valorLegible(d) + " — " + (d.texto || "un dato"));
    });
    lineas.push("");
  }
  lineas.push("LA CONVERSACIÓN");
  document.querySelectorAll("#resultado .msj").forEach(function(nodo){
    const quien = nodo.classList.contains("mia") ? "Yo" : "ACIJ Acceso";
    const marca = nodo.classList.contains("reemplazada") ? " [esto quedó sin efecto]" : "";
    const cuerpo = nodo.querySelector(".burbuja");
    if(!cuerpo) return;
    lineas.push("");
    lineas.push("[" + quien + marca + "]");
    lineas.push(cuerpo.innerText.trim());
  });
  return lineas.join("\n");
}

function bajarResumen(){
  const texto = textoDelResumen();
  const url = URL.createObjectURL(new Blob([texto], {type: "text/plain;charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url;
  a.download = "acij-acceso-lo-que-lei.txt";
  document.body.appendChild(a);
  a.click();
  a.remove();
  // Se libera enseguida: el resumen puede tener lo que la persona contó y no
  // tiene por qué seguir vivo en memoria después de guardarlo.
  setTimeout(function(){ URL.revokeObjectURL(url); }, 0);
  mostrarEstado("Lo bajé como archivo de texto. No es una constancia y no inicia ningún trámite.");
}

// --- borrado ----------------------------------------------------------------
// El frente ciudadano no guarda credenciales, pero sí tiene a la vista lo que la
// persona contó de su situación, y en un chat eso es más que en un formulario.
// Salir lo borra de verdad: el hilo entero, lo que quedó escrito sin enviar y
// cualquier cosa que haya quedado en el almacenamiento del navegador. Una
// pantalla compartida es el caso normal, no el raro.
function borrarTodo(mensaje, saludarDeNuevo){
  if(peticion) peticion.abort();
  // La pantalla se limpia ya, sin esperar a nadie: quien aprieta «salir» suele
  // tener a alguien al lado. El borrado en el servidor sale en paralelo y, si
  // falla, se dice; lo que no se hace es dejar la conversación a la vista
  // mientras se espera una respuesta de red.
  borrarConversacion().then(function(listo){
    if(!listo){
      mostrarEstado("Limpié la pantalla, pero no pude confirmar el borrado en el servidor. " +
        "Lo que habías confirmado se borra solo a la media hora sin usarlo.");
    }
  });
  $("resultado").innerHTML = "";
  $("pregunta").value = "";
  ajustarAlto();
  $("reintentar").hidden = true;
  ultimoEnvio = null;
  nMensajes = 0;
  contexto.jurisdiccion = null;
  contexto.jurisdiccionNombre = null;
  contexto.fecha = null;
  contexto.programa = null;
  contexto.programaNombre = null;
  pintarContexto();
  try{ sessionStorage.clear(); localStorage.clear(); }catch(_){}
  mostrarEstado(mensaje || "");
  document.body.classList.add("sin-conversacion");
  if(saludarDeNuevo) saludar();
  hayQueOfrecerElResumen();
  $("pregunta").focus();
}

// --- arranque ---------------------------------------------------------------
document.addEventListener("DOMContentLoaded", async function(){
  await cargarVocabularios();
  await cargarCobertura();
  await cargarNecesidades();
  saludar();
  pintarContexto();

  $("consulta").addEventListener("submit", function(evento){
    evento.preventDefault();
    enviar();
  });

  $("pregunta").addEventListener("input", ajustarAlto);
  $("pregunta").addEventListener("keydown", function(evento){
    if(evento.key === "Enter" && !evento.shiftKey){
      evento.preventDefault();
      enviar();
    }
  });

  $("cancelar").hidden = true;
  $("cancelar").addEventListener("click", function(){ if(peticion) peticion.abort(); });
  $("reintentar").addEventListener("click", function(){
    if(ultimoEnvio) consultar(ultimoEnvio);
  });
  $("limpiar").addEventListener("click", function(){
    borrarTodo("", true);
  });
  $("bajar-resumen").addEventListener("click", bajarResumen);
  $("borrar-conversacion").addEventListener("click", borrarLosDatos);
  $("salir").addEventListener("click", function(){
    borrarTodo("Listo. Borré la conversación y todo lo que habías escrito.", false);
  });
});
</script>
